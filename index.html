function makeApiSample(){
  return async function(input,opts){
    opts=opts||{};const key=apiKey();if(!key)throw{code:'not_granted'};
    const src=typeof input==='string'?[{role:'user',content:input}]:input;
    const msgs=[];src.forEach(m=>{const l=msgs[msgs.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else msgs.push({role:m.role,content:String(m.content)});});
    let res;
    try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:API_MODEL,max_tokens:2000,messages:msgs})});}
    catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw{code:'network'};}
    if(!res.ok){
      let msg='';try{const j=await res.json();msg=(j&&j.error&&j.error.message)||'';}catch(e){}
      const c=res.status===401||res.status===403?'bad_key':res.status===429?'rate_limited':res.status===402||/credit/i.test(msg)?'no_credit':res.status>=500?'overloaded':'api_error';
      throw{code:c,message:msg};
    }
    const j=await res.json();const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    if(opts.onText&&text)opts.onText({text,delta:text});
    return{text,truncated:j.stop_reason==='max_tokens'};
  };
}

    if(!(await ask('Hapus “'+it.name+'” dari daftar barang?','Hapus',true)))return;
    B.items=B.items.filter(x=>x.id!==it.id);markDirty('biz:'+B.id);closeSheet();render();toast('Barang dihapus');
  },
  async stockAdj(){
    const B=biz(),inv=roleAcc(B,'inv');if(!inv)return;
    const st=stockCalc(B).st;let val=0;stockItems(B).forEach(it=>{const s=st[it.id];if(s)val+=s.val;});
    const diff=R0(val-bs(B,lastDate()).inv);if(!diff)return;
    const cur=R0((B.opening.bal||{})[inv]),nv=cur+diff;
    if(nv<0){toast('Selisih tidak bisa disesuaikan lewat saldo awal. Catat penyesuaian lewat “Stok terpakai atau rusak”.');return;}
    if(!(await ask('Saldo awal persediaan akan diubah dari '+rp(cur)+' menjadi '+rp(nv)+', dan modal awal ikut '+(diff>0?'bertambah ':'berkurang ')+rp(Math.abs(diff))+'. Lanjutkan?','Sesuaikan')))return;
    B.opening.bal[inv]=nv;markDirty('biz:'+B.id);render();toast('Saldo awal persediaan disesuaikan');
  },
  itAdd(){const B=biz(),f=S.form;if(!f)return;const ch=itemChoices(B,f.kind);if(!ch.length)return;const used=new Set((f.items||[]).map(l=>l.item));const it=ch.find(x=>!used.has(x.id))||ch[0];f.items=(f.items||[]).concat([itemLine(B,f.kind,it)]);f._focus=f.items.length-1;reformSheet();},
  itDel(t){const f=S.form;if(!f)return;f.items.splice(+t.dataset.i,1);if(!f.items.length&&f.kind==='hpp_stok')f.amount=0;reformSheet();},
  itManual(){const f=S.form;if(!f)return;f.items=[];if(f.kind==='hpp_stok')f.amount=0;reformSheet();},
  cOpen(t){S.sheetBack=[];openContact(t.dataset.id,false);},
  cNew(){S.sheetBack=[];S.cedit={id:'',name:'',phone:'',type:'cust'};S.sheetCur={type:'cnew'};showSheet(contactNewHtml(),true);},
  cSave(){
    const B=biz(),F=S.cedit;if(!F)return;const err=$('#c-err'),name=(F.name||'').trim();
    if(!name){err.textContent='Isi nama kontak.';return;}
    const dup=findContact(B,name);if(dup&&dup.id!==F.id){err.textContent='Nama ini sudah ada di daftar kontak.';return;}
    let c=F.id?contactOf(B,F.id):null;if(!c){c={id:'c'+uid()};B.contacts.push(c);}
    Object.assign(c,{name,phone:(F.phone||'').trim(),type:F.type||'cust'});
    markDirty('biz:'+B.id);toast('Kontak disimpan');S.cedit=null;S.sheetCur={type:'contact',id:c.id};showSheet(contactHtml(B,c.id),true);render();
  },
  async cDel(t){
    const B=biz(),c=contactOf(B,t.dataset.id);if(!c)return;
    if(contactUsed(B,c.id)){toast('Kontak ini sudah dipakai di transaksi, jadi tidak bisa dihapus.');return;}
    if(!(await ask('Hapus kontak “'+c.name+'”?','Hapus',true)))return;
    B.contacts=B.contacts.filter(x=>x.id!==c.id);markDirty('biz:'+B.id);closeSheet();render();toast('Kontak dihapus');
  },
  payAr(t){
    const B=biz(),cid=t.dataset.id,c=contactOf(B,cid),A=arap(B,'ar').all[cid];
    pushBack();const f=newForm('terima_piutang');f.cname=c?c.name:'';f.cphone=c?c.phone||'':'';f.amount=A?Math.max(0,R0(A.bal)):0;f.desc=c?'Pelunasan tagihan '+c.name:'';openTxForm(f);
  },
  payAp(t){
    const B=biz(),cid=t.dataset.id,c=contactOf(B,cid),P=arap(B,'ap').all[cid];
    pushBack();const f=newForm('bayar_utang');const ap=roleAcc(B,'ap');if(ap)f.cat=ap;f.cname=c?c.name:'';f.cphone=c?c.phone||'':'';f.amount=P?Math.max(0,R0(P.bal)):0;f.desc=c?'Pembayaran utang ke '+c.name:'';openTxForm(f);
  },
  notaShow(t){openNota(t.dataset.id,!!t.dataset.sub&&!$('#sheet').hidden);},
  notaOpen(){const f=S.form;if(!f||!f.id)return;openNota(f.id,false);},
  async notaCopy(t){const B=biz(),e=txOf(B).find(x=>x.id===t.dataset.id);if(!e)return;const ok=await copyText(notaText(B,e));toast(ok?'Teks nota disalin. Tempel di WhatsApp atau aplikasi lain.':'Gagal menyalin. Coba lagi.');},
  notaDl(t){const B=biz(),e=txOf(B).find(x=>x.id===t.dataset.id);if(!e)return;saveFile('nota-'+slug((e.form&&e.form.no)||e.id)+'.html',notaDoc(B,e));},
  rNew(){S.sheetBack=[];S.recurMode=true;S.sheetCur={type:'picker'};showSheet(pickerHtml(),true);},
  rOpen(t){const B=biz(),r=B.recur.find(x=>x.id===t.dataset.id);if(!r)return;S.sheetBack=[];S.rform={id:r.id,desc:r.form.desc||'',amount:R0(r.form.amount),day:r.day,on:r.on!==false};S.sheetCur={type:'recur'};showSheet(recurHtml());},
  rSave(){
    const B=biz(),F=S.rform,r=F&&B.recur.find(x=>x.id===F.id);if(!r)return;
    if(!(F.amount>0)){$('#r-err').textContent='Isi jumlah lebih dari 0.';return;}
    r.form.desc=(F.desc||'').trim();r.form.amount=R0(F.amount);r.day=Math.min(31,Math.max(1,+F.day||1));r.on=!!F.on;
    markDirty('biz:'+B.id);closeSheet();render();toast('Transaksi rutin disimpan');
  },
  async rDel(){
    const B=biz(),F=S.rform;if(!F)return;
    if(!(await ask('Hapus jadwal transaksi rutin ini? Transaksi yang sudah tercatat tidak ikut terhapus.','Hapus',true)))return;
    B.recur=B.recur.filter(x=>x.id!==F.id);markDirty('biz:'+B.id);closeSheet();render();toast('Jadwal dihapus');
  },
  rCatat(t){const B=biz(),r=B.recur.find(x=>x.id===t.dataset.id);if(!r)return;S.sheetBack=[];openTxForm(formFromRecur(B,r,t.dataset.m));},
  rSkip(t){const B=biz(),r=B.recur.find(x=>x.id===t.dataset.id);if(!r)return;const m=t.dataset.m;if(!r.last||m>r.last)r.last=m;markDirty('biz:'+B.id);render();toast('Dilewati untuk '+monthLabel(m));},
  rAll(){
    const B=biz();let ok=0,bad=0;
    recurDue(B).forEach(x=>{const f=formFromRecur(B,x.r,x.m);if(validate(f,B)){bad++;return;}commitTx(B,f);if(!x.r.last||x.m>x.r.last)x.r.last=x.m;ok++;});
    markDirty('biz:'+B.id);render();toast(ok+' transaksi rutin dicatat'+(bad?', '+bad+' perlu dicatat manual':''));
  },
  bmStep(t){const mk=S.ui.bmonth||monthKey(todayStr());S.ui.bmonth=+t.dataset.v>0?nextMonth(mk):prevMonth(mk);render();},
  saveNota(){
    const B=biz();Object.assign(B.profile,{bankInfo:($('#sn-bank').value||'').trim(),notaNote:($('#sn-note').value||'').trim(),term:+$('#sn-term').value||30});
    markDirty('biz:'+B.id);toast('Pengaturan nota disimpan');
  },
});
Object.assign(ON,{
  itSel(t){
    const B=biz(),f=S.form;if(!f)return;const i=+t.dataset.it,l=f.items[i];if(!l)return;
    l.item=t.value;const it=itemOf(B,l.item);
    if(it){l.price=f.kind==='beli_stok'?R0(lastCost(B,it.id)):f.kind==='jual'?R0(it.price):0;const pi=$('input[data-in="money"][data-it="'+i+'"]');if(pi)pi.value=l.price?nf.format(l.price):'';const u=$('#itu-'+i);if(u)u.textContent=it.unit||'';}
    refreshPreview();
  },
  cname(t){const B=biz(),f=S.form;if(!f)return;const c=findContact(B,t.value);if(c&&c.phone){const p=$('#f-cphone');if(p&&!p.value.trim()){p.value=c.phone;f.cphone=c.phone;}}},
  fchk(t){if(!S.form)return;S.form[t.dataset.f]=t.checked;if(t.dataset.f==='mkRecur'){if(t.checked)S.form.items=[];reformSheet();}},
  notaAfter(t){S.ui.notaAfter=t.checked;saveUI();},
  isvc(t){if(!S.iform)return;S.iform.svc=t.value==='1';const b=$('#sheet .sh-body'),top=b?b.scrollTop:0;showSheet(itemHtml(),true);const nb=$('#sheet .sh-body');if(nb)nb.scrollTop=top;},
  cfv(t){if(S.cedit)S.cedit[t.dataset.f]=t.value;},
  rfv(t){if(!S.rform)return;const k=t.dataset.f;S.rform[k]=k==='on'?t.value==='1':k==='day'?+t.value:t.value;},
  bmonth(t){if(/^\d{4}-\d{2}$/.test(t.value)){S.ui.bmonth=t.value;render();}},
  bud(t){
    const B=biz(),id=t.dataset.id,v=parseNum(t.value);if(v)B.budget[id]=v;else delete B.budget[id];markDirty('biz:'+B.id);
    const d=budgetRows(B,S.ui.bmonth||monthKey(todayStr())),r=d.rows.find(x=>x.a.id===id),el=document.getElementById('bb-'+id);
    if(el&&r)el.outerHTML=meterHtml(r.act,r.bud,false,id);const tt=$('#bud-tot');if(tt)tt.textContent=budTotals(d);
  },
  target(t){
    const B=biz(),v=parseNum(t.value);if(v)B.target.rev=v;else delete B.target.rev;markDirty('biz:'+B.id);
    const d=budgetRows(B,S.ui.bmonth||monthKey(todayStr())),el=document.getElementById('bb-tgt');if(el)el.outerHTML=meterHtml(d.rev,d.target,true,'tgt');
  },
});
Object.assign(IN,{
  qty(t){
    const v=parseQty(t.value);
    if(t.dataset.it!=null&&S.form&&S.form.items){const l=S.form.items[+t.dataset.it];if(l){l.qty=v;refreshPreview();}}
    if(t.dataset.if&&S.iform)S.iform[t.dataset.if]=v;
  },
  ifv(t){if(S.iform)S.iform[t.dataset.f]=t.value;},
  cfv(t){if(S.cedit)S.cedit[t.dataset.f]=t.value;},
  rfv(t){if(S.rform)S.rform[t.dataset.f]=t.value;},
});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=ACT[t.dataset.act];if(!f)return;
  e.preventDefault();f(t,e);
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-on]');if(t&&ON[t.dataset.on])ON[t.dataset.on](t,e);});
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t&&IN[t.dataset.in])IN[t.dataset.in](t,e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#dlg').hidden)closeDlg(false);else if(!$('#sheet').hidden)closeSheet();return;}
  if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.id==='chatq'){e.preventDefault();ACT.sendChat();return;}
  if(e.key==='Enter'&&e.target&&e.target.closest&&e.target.closest('.sheet')&&e.target.tagName==='INPUT'&&!e.target.hasAttribute('list')&&e.target.type!=='checkbox'&&S.form&&$('#jprev')){e.preventDefault();saveTx(false);}
});
window.addEventListener('hashchange',route);
if(MQ.addEventListener)MQ.addEventListener('change',()=>{if(S.ui.view==='beranda')render();});else if(MQ.addListener)MQ.addListener(()=>{if(S.ui.view==='beranda')render();});

/* =========================================================
   Mulai
   ========================================================= */
function init(){
  try{const st=document.createElement('style');st.textContent=NOTA_CSS;document.head.appendChild(st);}catch(e){}
  LOCAL_OK=testLS();loadLocal();loadUI();demoDefaultPeriod();applyTheme();
  S.save.status=LOCAL_OK?'local':'memory';
  route();
  const cl=window.claude;
  if(cl&&typeof cl.use==='function'){
    cl.use('sample').then(s=>{S.sample=s||null;if(S.ui.view==='analisis')render();}).catch(()=>{S.sample=null;if(S.ui.view==='analisis')render();});
    cl.use('downloads').then(d=>{S.downloads=d||null;}).catch(()=>{S.downloads=null;});
    S.aiMode='claude';initDb();
  }else initStandalone();
}
init();
})();

</script>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>KasRapi – Laporan Keuangan UMKM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2944C4">
<meta name="description" content="Pembukuan dan laporan keuangan UMKM: laba rugi, neraca, arus kas, dan analisis.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KasRapi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --paper:#F3F6F2;--sheet:#FFFFFF;--ink:#15283A;--ink2:#465A6B;--ink3:#76879A;
  --rule:#DDE8E0;--rule2:#C3D5C8;--pen:#2944C4;--pen-ink:#FFFFFF;--pen-soft:#E6EBFB;
  --red:#C2392F;--red-soft:#FAE8E6;--green:#12744A;--green-soft:#E0F1E7;--amber:#9C6410;--amber-soft:#F8EDD8;
  --exp:#A9B4BD;--margin:rgba(194,57,47,.5);--scrim:rgba(12,22,32,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#132029;--sheet:#1A2934;--ink:#E4ECF0;--ink2:#AEBEC9;--ink3:#8193A0;
    --rule:#25394A;--rule2:#33495B;--pen:#93A6FF;--pen-ink:#0F1834;--pen-soft:#22305C;
    --red:#FF8A80;--red-soft:#3B2424;--green:#5DD39C;--green-soft:#173628;--amber:#F1B861;--amber-soft:#3B2F18;
    --exp:#5B6E7C;--margin:rgba(255,138,128,.45);--scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#132029;--sheet:#1A2934;--ink:#E4ECF0;--ink2:#AEBEC9;--ink3:#8193A0;
  --rule:#25394A;--rule2:#33495B;--pen:#93A6FF;--pen-ink:#0F1834;--pen-soft:#22305C;
  --red:#FF8A80;--red-soft:#3B2424;--green:#5DD39C;--green-soft:#173628;--amber:#F1B861;--amber-soft:#3B2F18;
  --exp:#5B6E7C;--margin:rgba(255,138,128,.45);--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pen)}
h1,h2,h3,h4{margin:0}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.ico{width:20px;height:20px;flex:none}
.grow{flex:1}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Kerangka ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--sheet);border-right:1px solid var(--rule);padding:22px 14px 18px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand-mark{width:32px;height:32px;flex:none}
.brand-mark .bm-bg{fill:var(--pen)}
.brand-mark .bm-line{stroke:var(--pen-ink);stroke-width:2;stroke-linecap:round;opacity:.92}
.brand-mark .bm-margin{stroke:#FF9187;stroke-width:1.4}
.bizsw .sel{display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--pen-soft);color:var(--pen)}
.side-foot{margin-top:auto;padding:0 8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 28px;background:var(--paper);border-bottom:1px solid var(--rule)}
.view{width:100%;max-width:1180px;margin:0 auto;padding:26px 28px 56px}
.bottom{display:none}
.app.nobiz .nav,.app.nobiz .bottom,.app.nobiz .bizsw,.app.nobiz .need-biz{display:none!important}
@media (min-width:900px){.mob{display:none!important}}
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side,.desk{display:none!important}
  .topbar{padding:8px 14px;min-height:58px;gap:10px}
  .topbar .bizsw{flex:1;min-width:0}
  .view{padding:18px 16px 112px}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);text-decoration:none;padding:4px 0;background:none;border:0}
  .bottom a[aria-current="page"]{color:var(--pen)}
  .bottom .fab span:first-child{width:46px;height:46px;border-radius:14px;background:var(--pen);color:var(--pen-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(41,68,196,.35)}
  .bottom .fab{color:var(--ink)}
}
@media (max-width:380px){.topbar .brand>span:last-child{display:none}}

/* ---------- Komponen dasar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--pen);color:var(--pen-ink);font-weight:700;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn .ico{width:18px;height:18px}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule2)}
.btn.ghost:hover{filter:none;border-color:var(--ink3)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-text{color:var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid var(--rule2);background:var(--sheet);color:var(--ink2);text-decoration:none}
.icon-btn:hover{color:var(--ink);border-color:var(--ink3)}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm .ico{width:17px;height:17px}
.linkbtn{background:none;border:0;padding:0;color:var(--pen);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.end{justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--ink2)}
.input{width:100%;min-width:0;height:44px;border:1px solid var(--rule2);background:var(--sheet);border-radius:10px;padding:0 12px;font-size:15px}
textarea.input{height:auto;min-height:44px;padding:10px 12px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.input.sm{height:38px;font-size:14px;border-radius:9px}
.sel{position:relative;display:inline-block;min-width:0}
.field .sel{display:block}
.sel select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.amt-wrap{display:flex;align-items:center;border:1px solid var(--rule2);background:var(--sheet);border-radius:10px;padding-left:12px}
.amt-wrap:focus-within{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.amt-wrap>span{font-weight:700;color:var(--ink3)}
.amt-wrap .input{border:0;box-shadow:none!important;background:transparent;padding-left:8px}
.amount-in{height:58px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.45}
.ferr{color:var(--red);font-weight:600;font-size:13.5px;margin:0;min-height:0}
.ferr:empty{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.neutral{background:var(--pen-soft);color:var(--pen)}
.tag{font-size:11.5px;font-weight:700;color:var(--ink3);border:1px solid var(--rule2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.panel{background:var(--sheet);border:1px solid var(--rule2);border-radius:16px;padding:20px}
.panel>h2,.ph{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:14px;margin:4px 0 0}
.notice{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;color:var(--ink2);font-size:14px}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.empty p{max-width:42ch;margin:0 auto 14px}
.sstat{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap}
.sstat i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.sstat.warn i{background:var(--amber)}
.sstat.bad i{background:var(--red)}
.sstat.busy i{background:var(--pen);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.thinking{color:var(--ink3);animation:pulse 1.4s ease-in-out infinite}

/* ---------- Kepala halaman ---------- */
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.vhead h1{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.vtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.period .input[type=date]{width:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--rule2);background:var(--sheet);font-weight:600;font-size:13.5px;color:var(--ink2)}
.tabs button:hover{border-color:var(--ink3);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tabs.compact{margin:0}

/* ---------- Beranda ---------- */
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.hero .when{font-size:13.5px;font-weight:700;color:var(--ink3)}
.headline{font-size:clamp(27px,3.6vw,40px);font-weight:800;letter-spacing:-.025em;line-height:1.14;max-width:24ch;margin:6px 0 10px;text-wrap:balance}
.lede{color:var(--ink2);max-width:62ch;margin:0 0 12px;font-size:15.5px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--sheet);border:1px solid var(--rule2);border-radius:16px;overflow:hidden}
.strip>*{padding:15px 18px;border-left:1px solid var(--rule);min-width:0}
.strip>*:first-child{border-left:0}
.strip .k{font-size:12.5px;font-weight:700;color:var(--ink3)}
.strip .v{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .s{font-size:12px;color:var(--ink3)}
@media (max-width:899px){.strip{grid-template-columns:1fr 1fr}.strip>*:nth-child(3){border-left:0}.strip>*:nth-child(n+3){border-top:1px solid var(--rule)}.strip .v{font-size:17px}}
.duo{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);background:var(--sheet);border:1px solid var(--rule2);border-radius:16px;margin-top:16px}
.duo>section{padding:20px;min-width:0}
.duo>section+section{border-left:1px solid var(--rule)}
@media (max-width:899px){.duo{grid-template-columns:1fr}.duo>section+section{border-left:0;border-top:1px solid var(--rule)}}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.sechead h2{font-size:16px;font-weight:800}
.sechead a{font-size:13.5px;font-weight:700;text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.k-rev{background:var(--pen)}.k-exp{background:var(--exp)}.k-ni{background:var(--green);border-radius:50%!important}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .c-grid{stroke:var(--rule);stroke-width:1}
.chart .c-zero{stroke:var(--ink3);stroke-width:1}
.chart .c-ax{fill:var(--ink3);font:600 11px var(--font)}
.chart .c-rev{fill:var(--pen)}
.chart .c-exp{fill:var(--exp)}
.chart .c-line{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round}
.chart .c-ni{fill:var(--green);stroke:var(--sheet);stroke-width:2}
.chart .c-loss{fill:var(--red);stroke:var(--sheet);stroke-width:2}
.bars{list-style:none;margin:0;padding:0}
.bars li{border-bottom:1px solid var(--rule)}
.bars .bb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;width:100%;padding:9px 0;font:inherit;font-size:14px;color:inherit;background:none;border:0;text-align:left;cursor:pointer}
.bars .bb:hover>span:first-child{color:var(--pen)}
.bars li:last-child{border-bottom:0}
.bars .bb>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bb>span:nth-child(2){font-weight:700}
.bars .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--paper)}
.bars .fill{height:100%;border-radius:3px;background:var(--ink3)}
.bars .pc{font-size:12px;color:var(--ink3);font-weight:600;margin-left:6px}
.notes{list-style:none;margin:0;padding:0}
.notes li{padding:8px 0 8px 14px;border-left:3px solid var(--rule2);margin:0 0 10px;font-size:14.5px;color:var(--ink)}
.notes li.good{border-color:var(--green)}.notes li.bad{border-color:var(--red)}.notes li.warn{border-color:var(--amber)}
.steps{display:grid;gap:12px;margin:8px 0 18px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;background:var(--sheet);border:1px solid var(--rule2);border-radius:16px;padding:18px}
.step .sn{width:36px;height:36px;border-radius:50%;border:2px solid var(--pen);color:var(--pen);display:grid;place-items:center;font-weight:800}
.step h3{font-size:16px;font-weight:800;margin-bottom:4px}
.step p{margin:0 0 10px;color:var(--ink2)}

/* ---------- Daftar transaksi ---------- */
.txtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 260px;min-width:0}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);width:18px;height:18px}
.search .input{padding-left:38px}
.txsum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink2);margin:6px 2px 10px}
.txsum b{font-weight:800}
.in{color:var(--green)}.out{color:var(--red)}
.txsheet{background:var(--sheet);border:1px solid var(--rule2);border-radius:16px;padding:4px 10px 8px}
.daygroup h4{font-size:12.5px;font-weight:700;color:var(--ink3);padding:14px 6px 6px;border-bottom:1px solid var(--rule)}
.txrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 6px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;border-radius:0}
.txrow:hover{background:var(--paper)}
.daygroup .txrow:last-child{border-bottom:0}
.txrow .d{min-width:0}
.txrow .d b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .d span{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px}
.amt.in{color:var(--green)}.amt.out{color:var(--red)}.amt.other{color:var(--ink2)}
.kico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.kico .ico{width:18px;height:18px}
.kico.in{background:var(--green-soft);color:var(--green)}
.kico.out{background:var(--red-soft);color:var(--red)}
.kico.other{background:var(--pen-soft);color:var(--pen)}
.more{text-align:center;font-size:13px;color:var(--ink3);padding:10px}

/* ---------- Lembar buku besar (laporan) ---------- */
.ledger{--mx:46px;--cw:150px;--cw2:128px;position:relative;background:var(--sheet);border:1px solid var(--rule2);border-radius:16px;overflow:hidden;padding:26px 0 18px}
.ledger::before{content:"";position:absolute;top:0;bottom:0;left:var(--mx);width:5px;border-left:1px solid var(--margin);border-right:1px solid var(--margin);pointer-events:none}
.rhead{text-align:center;padding:0 22px 18px calc(var(--mx) + 10px)}
.rh-biz{font-weight:700;font-size:14px;color:var(--ink2)}
.rh-title{font-weight:800;font-size:22px;letter-spacing:-.015em;margin:2px 0 3px;line-height:1.25}
.rh-sub{font-size:13px;color:var(--ink3)}
.lr{display:grid;grid-template-columns:minmax(0,1fr) var(--cw);align-items:end;gap:14px;min-height:38px;padding:8px 24px 6px calc(var(--mx) + 20px);border-bottom:1px solid var(--rule);font-size:14.5px}
.lr.c2{grid-template-columns:minmax(0,1fr) var(--cw) var(--cw)}
.lr.c3{grid-template-columns:minmax(0,1fr) var(--cw2) var(--cw2)}
.lr .lbl{min-width:0;overflow-wrap:anywhere}
.lr .v{text-align:right;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.lr .neg{color:var(--red)}
.lr.colhead{font-size:12px;font-weight:700;color:var(--ink3);min-height:30px;padding-top:4px;border-bottom-color:var(--rule2)}
.lr.sec{font-weight:800;padding-top:18px}
.lr.item .lbl{padding-left:18px;color:var(--ink2)}
.lr.sub{font-weight:800}
.lr.sub .v{position:relative}
.lr.sub .v::before{content:"";position:absolute;left:30%;right:0;top:-6px;border-top:1px solid var(--ink2)}
.lr.grand{font-weight:800;font-size:16px;border-bottom:0;padding-top:12px;padding-bottom:14px}
.lr.grand .v{border-bottom:3px double var(--ink);padding-bottom:2px}
.lr.jhead{font-weight:700;padding-top:14px;min-height:34px}
.lr.jhead .jd{color:var(--ink3);font-weight:700;margin-right:8px}
.lr.kr .lbl{padding-left:44px}
.lnote{font-size:13px;color:var(--ink3);padding:0 24px 8px calc(var(--mx) + 20px);margin:0}
.bsgrid{display:grid;grid-template-columns:1fr 1fr}
.bscol{display:flex;flex-direction:column;min-width:0}
.bscol .grand{margin-top:auto}
.bscol.right{border-left:1px solid var(--rule2)}
.bscol.right .lr{padding-left:22px}

async function writeKey(k){
  const col=S.db.collection('data/users/'+S.uid);
  const p=k.split(':');
  if(p[0]==='index') return col.doc('index').set({ids:S.data.index.ids.slice(),active:S.data.index.active||'',v:1});
  if(p[0]==='biz'){
    const B=S.data.biz[p[1]];const ref=col.doc('biz_'+p[1]);
    return B?ref.set({biz:clone(B)}):ref.delete();
  }
  if(p[0]==='tx'){
    const id=p[1],mk=p[2],base='tx_'+id+'_'+mk.replace('-','');
    const items=(S.data.tx[id]||[]).filter(e=>monthKey(e.date)===mk).map(clone);
    const chunks=[];let cur=[],size=0;
    for(const it of items){const s=JSON.stringify(it).length;if(size+s>180000&&cur.length){chunks.push(cur);cur=[];size=0;}cur.push(it);size+=s;}
    if(cur.length)chunks.push(cur);
    const old=S.parts[base]||1;
    for(let i=0;i<chunks.length;i++){await col.doc(i?base+'_'+(i+1):base).set({biz:id,month:mk,items:chunks[i]});}
    for(let i=Math.max(chunks.length,0);i<old;i++){await col.doc(i?base+'_'+(i+1):base).delete();}
    S.parts[base]=Math.max(chunks.length,1);
  }
}
async function writeWithRetry(k){
  try{await writeKey(k);}
  catch(e){if(e&&e.code==='unavailable'){await sleep(500+Math.random()*700);await writeKey(k);}else throw e;}
}
async function flush(){
  if(!S.db)return;
  if(S.save.flushing){S.save.again=true;return;}
  S.save.flushing=true;
  try{
    while(S.save.dirty.size){
      const keys=Array.from(S.save.dirty);S.save.dirty.clear();
      for(let i=0;i<keys.length;i++){
        try{await writeWithRetry(keys[i]);}
        catch(e){keys.slice(i).forEach(x=>S.save.dirty.add(x));throw e;}
      }
    }
    setSave('saved');
  }catch(e){
    const c=e&&e.code;
    if(['invalid_argument','not_granted','revoked','capability_disabled','capability_removed'].includes(c)){
      S.db=null;S.save.dirty.clear();setSave(LOCAL_OK?'local':'memory');
      toast('Data tidak bisa disimpan ke akun, jadi disimpan di perangkat ini.');
    }else if(c==='quota_exceeded'){
      setSave('error');toast('Penyimpanan akun penuh. Unduh cadangan, lalu hapus usaha yang tidak dipakai.');
    }else{
      setSave('error');clearTimeout(S.save.timer);S.save.timer=setTimeout(flush,15000);
    }
  }finally{
    S.save.flushing=false;
    if(S.save.again){S.save.again=false;if(S.save.dirty.size&&S.db)flush();}
  }
}
async function initDb(){
  let db,user;
  try{const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);db=r[0];user=r[1];}catch(e){return;}
  if(!db||!user)return;
  let id=null;try{id=await user.id();}catch(e){}
  if(!id)return;
  S.db=db;S.uid=id;setSave('loading');
  let snap;
  try{snap=await withTimeout((async()=>{try{return await db.collection('data/users/'+id).limit(1000).get();}catch(e){if(e&&e.code==='unavailable'){await sleep(600);return db.collection('data/users/'+id).limit(1000).get();}throw e;}})(),12000);}
  catch(e){S.db=null;setSave(LOCAL_OK?'local':'memory');toast('Penyimpanan akun belum bisa dijangkau. Data disimpan di perangkat ini dulu.');return;}
  const docs={};
  snap.docs.forEach(d=>{if(d.exists)docs[d.id]=d.data();});
  const idx=docs.index;
  if(idx&&Array.isArray(idx.ids)&&idx.ids.length){
    const data={index:{ids:idx.ids.slice(),active:idx.active||null},biz:{},tx:{}};
    for(const k of Object.keys(docs)){
      const v=docs[k];
      if(k.indexOf('biz_')===0&&v.biz&&v.biz.id) data.biz[v.biz.id]=clone(v.biz);
      const m=k.match(/^tx_(.+)_(\d{6})(?:_(\d+))?$/);
      if(m&&Array.isArray(v.items)){
        (data.tx[v.biz]=data.tx[v.biz]||[]).push.apply(data.tx[v.biz],clone(v.items));
        const base='tx_'+m[1]+'_'+m[2];S.parts[base]=Math.max(S.parts[base]||1,m[3]?+m[3]:1);
      }
    }
    S.data=data;normalizeData();saveLocal();setSave('saved');demoDefaultPeriod();render();
  }else if(S.data.index.ids.length){
    markAll();
  }else setSave('saved');
}

function defaultAccounts(){return ACC_DEFAULT.map(r=>Object.assign({id:r[0],name:r[1],group:r[2]},r[3]));}
function newBiz(o){
  const start=o.start||firstOfMonth();
  return{id:'b'+uid(),profile:{name:o.name,owner:o.owner||'',type:o.type||'dagang',sector:o.sector||'Lainnya',city:o.city||'',tax:'none',wp:'op',phone:'',address:'',bankInfo:'',notaNote:'',term:30},accounts:defaultAccounts(),opening:{date:start,bal:o.bal||{}},items:[],contacts:[],budget:{},target:{},recur:[],seq:{inv:0,kw:0},created:Date.now()};
}
const AMAP=new WeakMap();
function acc(B,id){let m=AMAP.get(B.accounts);if(!m){m=new Map(B.accounts.map(a=>[a.id,a]));AMAP.set(B.accounts,m);}return m.get(id);}
function roleAcc(B,r){const a=B.accounts.find(x=>x.role===r);return a?a.id:null;}
const isCash=a=>!!a&&(a.role==='cash'||a.role==='bank');
function accNormal(a){const n=GROUPS[a.group].normal;return a.contra?(n==='D'?'K':'D'):n;}
function openingEntry(B){
  const L=[];let diff=0;
  for(const id of Object.keys(B.opening.bal||{})){
    const v=R0(B.opening.bal[id]);if(!v)continue;
    const a=acc(B,id);if(!a)continue;
    if(accNormal(a)==='D'){L.push({a:id,d:v,c:0});diff+=v;}else{L.push({a:id,d:0,c:v});diff-=v;}
  }
  const cap=roleAcc(B,'capital');
  if(diff>0)L.push({a:cap,d:0,c:diff});else if(diff<0)L.push({a:cap,d:-diff,c:0});
  return L.length?{id:'opening',date:B.opening.date,desc:'Saldo awal',kind:'opening',opening:true,lines:L}:null;
}
function allEntries(B){const o=openingEntry(B);const l=txOf(B);return o?[o].concat(l):l;}
function netMap(E,from,to){
  const m={};
  for(const e of E){if(from&&e.date<from)continue;if(to&&e.date>to)continue;for(const l of e.lines)m[l.a]=(m[l.a]||0)+(l.d||0)-(l.c||0);}
  return m;
}
function plFromMap(B,m){
  const rows={rev:[],cogs:[],opx:[],oi:[],oe:[],tax:[]};const t={rev:0,cogs:0,opx:0,oi:0,oe:0,tax:0,sales:0};
  for(const a of B.accounts){
    if(!(a.group in rows))continue;
    const net=m[a.id]||0;const v=GROUPS[a.group].type==='rev'?-net:net;
    if(R0(v)!==0)rows[a.group].push({a,v});
    t[a.group]+=v;
    if(a.group==='rev'&&!a.contra)t.sales+=v;
  }
  const gross=t.rev-t.cogs,op=gross-t.opx,ebt=op+t.oi-t.oe,ni=ebt-t.tax;
  return{rows,t,gross,op,ebt,ni};
}
function pl(B,from,to){return plFromMap(B,netMap(allEntries(B),from,to));}
function bs(B,to,from){
  const m=netMap(allEntries(B),null,to);
  const groups={al:[],at:[],kp:[],kj:[],eq:[]};const t={al:0,at:0,kp:0,kj:0,eq:0};
  for(const a of B.accounts){
    if(!(a.group in groups))continue;
    const net=m[a.id]||0;const v=GROUPS[a.group].type==='asset'?net:-net;
    groups[a.group].push({a,v});t[a.group]+=v;
  }
  const niAll=plFromMap(B,m).ni;
  const niPeriod=from?pl(B,from,to).ni:niAll;
  const sumRole=r=>B.accounts.filter(a=>a.role===r).reduce((s,a)=>s+(m[a.id]||0),0);
  const totalAssets=t.al+t.at,totalLiab=t.kp+t.kj,equity=t.eq+niAll;
  return{m,groups,t,niAll,niPeriod,niPrior:niAll-niPeriod,totalAssets,totalLiab,equity,cash:B.accounts.filter(isCash).reduce((s,a)=>s+(m[a.id]||0),0),ar:sumRole('ar'),inv:sumRole('inv')};
}
function cfClass(a){if(a.group==='at')return'inv';if(a.group==='eq'||a.group==='kj'||a.role==='loan')return'fin';return'op';}
function cashflow(B,from,to,cb){
  const cashIds=new Set(B.accounts.filter(isCash).map(a=>a.id));
  const res={start:0,op:{},inv:{},fin:{},tot:{op:0,inv:0,fin:0},opOut:0,opIn:0};
  for(const e of allEntries(B)){
    if(to&&e.date>to)continue;
    let cd=0;for(const l of e.lines)if(cashIds.has(l.a))cd+=(l.d||0)-(l.c||0);
    if(!R0(cd))continue;
    if(e.opening||(from&&e.date<from)){res.start+=cd;continue;}
    let parts=e.lines.filter(l=>!cashIds.has(l.a)&&l.k);
    if(!parts.length)parts=e.lines.filter(l=>!cashIds.has(l.a));
    if(!parts.length)continue;
    const effs=parts.map(l=>-((l.d||0)-(l.c||0)));const sum=effs.reduce((s,v)=>s+v,0);
    parts.forEach((l,i)=>{
      let eff=effs[i];if(sum&&Math.abs(sum-cd)>0.5)eff=eff/sum*cd;
      const a=acc(B,l.a);const c=a?cfClass(a):'op';
      res[c][l.a]=(res[c][l.a]||0)+eff;res.tot[c]+=eff;if(cb)cb(c,l.a,e,eff);
      if(c==='op'){if(eff<0)res.opOut-=eff;else res.opIn+=eff;}
    });
  }
  res.net=res.tot.op+res.tot.inv+res.tot.fin;res.end=res.start+res.net;
  return res;
}
function equityStmt(B,from,to){
  let start=0,add=0,draw=0,other=0;
  for(const e of allEntries(B)){
    if(to&&e.date>to)continue;
    const pre=e.opening||(from&&e.date<from);
    for(const l of e.lines){
      const a=acc(B,l.a);if(!a||a.group!=='eq')continue;
      const v=(l.c||0)-(l.d||0);
      if(pre)start+=v;else if(a.role==='drawing')draw-=v;else if(a.role==='capital')add+=v;else other+=v;
    }
  }
  if(from)start+=pl(B,null,addDays(from,-1)).ni;
  const ni=pl(B,from,to).ni;
  return{start,add,draw,other,ni,end:start+add+other-draw+ni};
}
const inP=(e,P)=>(!P.from||e.date>=P.from)&&e.date<=P.to;
function firstDate(B){let f=B.opening.date||todayStr();for(const e of txOf(B))if(e.date<f)f=e.date;return f;}
function lastDate(){const B=biz();let l=todayStr();if(B)for(const e of txOf(B))if(e.date>l)l=e.date;return l;}
function bizHasStock(B){
  if((BIZ_TYPES[B.profile.type]||{}).stock)return true;
  const inv=roleAcc(B,'inv');if(!inv)return false;
  if(R0((B.opening.bal||{})[inv]))return true;
  return txOf(B).some(e=>e.lines.some(l=>l.a===inv));
}
function accUsed(B,id){if(R0((B.opening.bal||{})[id]))return true;return txOf(B).some(e=>e.lines.some(l=>l.a===id)||(e.form&&[e.form.cat,e.form.via,e.form.from,e.form.to,e.form.debit,e.form.credit].includes(id)));}
function sales(B,from,to){const m=netMap(txOf(B),from,to);return B.accounts.filter(a=>a.group==='rev'&&!a.contra).reduce((s,a)=>s-(m[a.id]||0),0);}
function monthlySeries(B,endKey,n){
  const a=endKey.split('-').map(Number);const keys=[];
  const fk=monthKey(firstDate(B));
  for(let i=n-1;i>=0;i--){const d=new Date(a[0],a[1]-1-i,1);const k=d.getFullYear()+'-'+pad(d.getMonth()+1);if(k>=fk||i===0)keys.push(k);}
  const map={};keys.forEach(k=>map[k]={key:k,rev:0,exp:0});
  for(const e of txOf(B)){
    const o=map[monthKey(e.date)];if(!o)continue;
    for(const l of e.lines){const x=acc(B,l.a);if(!x)continue;const G=GROUPS[x.group];const net=(l.d||0)-(l.c||0);if(G.type==='rev')o.rev-=net;else if(G.type==='exp')o.exp+=net;}
  }
  return keys.map(k=>{const o=map[k];const p=k.split('-').map(Number);o.ni=o.rev-o.exp;o.label=BLN[p[1]-1];o.full=BULAN[p[1]-1]+' '+p[0];return o;});
}
function ratios(B,P){
  const p=pl(B,P.from,P.to),b=bs(B,P.to,P.from),c=cashflow(B,P.from,P.to);
  const fromD=P.from||firstDate(B);
  const days=Math.max(1,Math.round((parseD(P.to)-parseD(fromD))/864e5)+1);
  const months=Math.max(1,days/30.44);
  const rev=p.t.rev;
  const avgOut=c.opOut/months;
  const fixedMonthly=p.t.opx/months;
  const varRatio=rev>0?p.t.cogs/rev:NaN;
  return{p,b,c,days,months,rev,
    grossMargin:rev>0?p.gross/rev:NaN,netMargin:rev>0?p.ni/rev:NaN,opexRatio:rev>0?p.t.opx/rev:NaN,
    currentRatio:b.t.kp>0.5?b.t.al/b.t.kp:null,
    der:b.equity>0?b.totalLiab/b.equity:null,
    roa:b.totalAssets>0?p.ni/b.totalAssets:NaN,
    runway:avgOut>0?Math.max(0,b.cash)/avgOut:null,
    arDays:rev>0&&b.ar>0?b.ar/rev*days:null,
    invDays:p.t.cogs>0&&b.inv>0?b.inv/p.t.cogs*days:null,
    fixedMonthly,varRatio,bep:rev>0&&varRatio<1?fixedMonthly/(1-varRatio):null,avgRev:rev/months};
}
function health(R,prev){
  const parts=[];let s=0,v;
  const nm=R.netMargin;
  v=!Number.isFinite(nm)?0:nm>=.15?30:nm>=.08?24:nm>0?15:0;
  parts.push({k:'Keuntungan',v,max:30,d:Number.isFinite(nm)?'Margin laba bersih '+pct(nm):'Belum ada pendapatan'});s+=v;
  const rw=R.runway;
  v=rw==null?(R.b.cash>0?25:5):rw>=3?25:rw>=1.5?16:rw>=0.5?7:0;
  parts.push({k:'Ketahanan kas',v,max:25,d:rw==null?'Belum ada pengeluaran operasional':'Kas cukup untuk '+fmtMonths(rw)+' biaya rutin'});s+=v;
  const cr=R.currentRatio;
  v=cr==null?20:cr>=1.5?20:cr>=1?12:3;
  parts.push({k:'Bayar utang jangka pendek',v,max:20,d:cr==null?'Tidak ada utang jangka pendek':'Aset lancar '+num2(cr)+'× utang jangka pendek'});s+=v;
  const eq=R.b.equity,der=R.der;
  v=eq<=0?0:der<=1?15:der<=2?8:2;
  parts.push({k:'Struktur modal',v,max:15,d:eq<=0?'Modal bersih negatif':'Utang '+num2(der)+'× modal sendiri'});s+=v;
  let tv=6,td='Belum ada data periode pembanding';
  if(prev&&prev.t.rev>0){const ch=(R.rev-prev.t.rev)/prev.t.rev;tv=ch>=.05?10:ch>=-.05?6:2;td='Pendapatan '+(ch>=0?'naik ':'turun ')+pct(Math.abs(ch))+' dari periode sebelumnya';}
  parts.push({k:'Tren pendapatan',v:tv,max:10,d:td});s+=tv;
  s=Math.round(s);
  return{score:s,tone:s>=70?'good':s>=45?'warn':'bad',label:s>=70?'Sehat':s>=45?'Perlu perhatian':'Waspada',parts};
}
function costItems(p){
  const items=[];
  ['cogs','opx','oe','tax'].forEach(g=>p.rows[g].forEach(r=>{if(r.v>0)items.push({l:r.a.name,v:r.v,ids:[r.a.id]});}));
  items.sort((a,b)=>b.v-a.v);
  const tot=items.reduce((s,x)=>s+x.v,0);
  const top=items.slice(0,6);const rest=items.slice(6).reduce((s,x)=>s+x.v,0);
  if(rest>0)top.push({l:'Lainnya',v:rest,ids:items.slice(6).reduce((a,x)=>a.concat(x.ids),[])});

function insights(B,P,R,prev){
  const out=[];const p=R.p;
  if(!R0(p.t.rev)&&!R0(p.t.opx)&&!R0(p.t.cogs)){out.push({t:'neutral',s:'Belum ada pendapatan atau biaya tercatat di periode ini.'});return out;}
  if(p.ni>=0)out.push({t:'good',s:'Usaha untung '+rp(p.ni)+'. Dari setiap Rp 100 pendapatan, sekitar Rp '+Math.max(0,Math.round((R.netMargin||0)*100))+' menjadi laba bersih.'});
  else out.push({t:'bad',s:'Usaha rugi '+rp(-p.ni)+'. Biaya lebih besar dari pendapatan, mulai periksa biaya terbesar.'});
  if(prev&&prev.t.rev>0){
    const ch=(p.t.rev-prev.t.rev)/prev.t.rev;
    if(ch>=.05)out.push({t:'good',s:'Pendapatan naik '+pct(ch)+' dibanding '+P.prev.label+'.'});
    else if(ch<=-.05)out.push({t:'warn',s:'Pendapatan turun '+pct(-ch)+' dibanding '+P.prev.label+'. Cek apakah karena musim, harga, atau jumlah pelanggan.'});
  }
  const ci=costItems(p);
  if(ci.all.length&&ci.tot>0){const b=ci.all[0];const sh=b.v/ci.tot;if(sh>=.35)out.push({t:'warn',s:b.l+' memakan '+pct(sh,0)+' dari seluruh biaya. Pos ini paling berpengaruh pada laba.'});}
  if(R.b.inv<-0.5)out.push({t:'bad',s:'Nilai persediaan tercatat minus. Catat pembelian stok atau isi saldo awal persediaan agar laporan akurat.'});
  if(R.b.cash<-0.5)out.push({t:'bad',s:'Saldo kas dan bank tercatat minus. Periksa apakah ada uang masuk yang belum dicatat.'});
  else if(R.runway!=null){
    if(R.runway<1)out.push({t:'bad',s:'Kas hanya cukup untuk sekitar '+fmtMonths(R.runway)+' biaya rutin. Tunda pengeluaran yang tidak mendesak.'});
    else if(R.runway<2)out.push({t:'warn',s:'Kas cukup untuk sekitar '+fmtMonths(R.runway)+' biaya rutin. Idealnya minimal 3 bulan.'});
    else if(R.runway>=3)out.push({t:'good',s:'Cadangan kas aman, cukup untuk sekitar '+fmtMonths(R.runway)+' biaya rutin.'});
  }
  if(R.arDays!=null&&R.arDays>30)out.push({t:'warn',s:'Piutang rata-rata baru tertagih dalam '+Math.round(R.arDays)+' hari. Tagih pelanggan yang sudah lewat jatuh tempo.'});
  if(R.currentRatio!=null&&R.currentRatio<1)out.push({t:'bad',s:'Utang jangka pendek lebih besar dari aset lancar. Atur jadwal pembayaran sebelum jatuh tempo.'});
  return out.slice(0,5);
}
function taxEstimate(B,P){
  if(B.profile.tax!=='final05')return null;
  const TH=500e6,op=B.profile.wp!=='badan';
  const from=P.from||firstDate(B),to=P.to;
  let omz=0,taxable=0;
  for(let y=+from.slice(0,4);y<=+to.slice(0,4);y++){
    const ys=y+'-01-01',ye=y+'-12-31';
    const sf=from>ys?from:ys,st=to<ye?to:ye;
    const seg=sales(B,sf,st);omz+=seg;
    if(!op){taxable+=seg;continue;}
    const before=sf>ys?sales(B,ys,addDays(sf,-1)):0;
    taxable+=Math.max(0,before+seg-TH)-Math.max(0,before-TH);
  }
  const est=R0(taxable*0.005);
  const policy='Usaha memakai skema PPh final 0,5% dari omzet bruto (PP 55/2022).'+(op?' Sebagai wajib pajak orang pribadi, omzet sampai Rp 500 juta per tahun tidak dikenai PPh final.':'');
  const text='Omzet bruto periode ini '+rp(omz)+'. Perkiraan PPh final terutang '+rp(est)+(op&&taxable<omz-0.5?', setelah memperhitungkan batas omzet tidak kena pajak':'')+'. Angka ini estimasi; pastikan dengan ketentuan terbaru DJP atau konsultan pajak.';
  return{omz,est,taxable,policy,text};
}

function resolvePeriod(p){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const mon=(yy,mm)=>{const d=new Date(yy,mm,1);return{from:ymd(d),to:ymd(new Date(d.getFullYear(),d.getMonth()+1,0)),label:BULAN[d.getMonth()]+' '+d.getFullYear(),short:BLN[d.getMonth()]+' '+d.getFullYear()};};
  const pre=(p&&p.preset)||'bulan';let r;
  if(pre.indexOf('m:')===0){const a=pre.slice(2).split('-').map(Number);r=mon(a[0],a[1]-1);r.prev=mon(a[0],a[1]-2);r.phrase='pada '+r.label;}
  else switch(pre){
    case 'bulanlalu':r=mon(y,m-1);r.prev=mon(y,m-2);r.phrase='pada '+r.label;break;
    case '3bulan':r={from:ymd(new Date(y,m-2,1)),to:ymd(new Date(y,m+1,0)),label:'3 bulan terakhir',short:'3 bln terakhir'};r.prev={from:ymd(new Date(y,m-5,1)),to:ymd(new Date(y,m-2,0)),label:'3 bulan sebelumnya',short:'3 bln sebelumnya'};r.phrase='dalam 3 bulan terakhir';break;
    case 'tahun':r={from:y+'-01-01',to:y+'-12-31',label:'Tahun '+y,short:String(y)};r.prev={from:(y-1)+'-01-01',to:(y-1)+'-12-31',label:'tahun '+(y-1),short:String(y-1)};r.phrase='sepanjang '+y;break;
    case 'tahunlalu':r={from:(y-1)+'-01-01',to:(y-1)+'-12-31',label:'Tahun '+(y-1),short:String(y-1)};r.prev={from:(y-2)+'-01-01',to:(y-2)+'-12-31',label:'tahun '+(y-2),short:String(y-2)};r.phrase='sepanjang '+(y-1);break;
    case 'semua':r={from:null,to:lastDate(),label:'Semua waktu',short:'Semua waktu'};r.prev=null;r.phrase='sejak mulai mencatat';break;
    case 'custom':{
      let f=p.from||ymd(new Date(y,m,1)),t=p.to||todayStr();if(f>t){const x=f;f=t;t=x;}
      const len=Math.round((parseD(t)-parseD(f))/864e5)+1;
      r={from:f,to:t,label:fmtShort(f)+' – '+fmtShort(t),short:fmtShort(f)+' – '+fmtShort(t)};
      r.prev={from:addDays(f,-len),to:addDays(f,-1),label:'periode sebelumnya',short:'Sebelumnya'};r.phrase='pada '+r.label;break;}
    default:r=mon(y,m);r.prev=mon(y,m-1);r.phrase='pada '+r.label;
  }
  return r;
}

  return{rows,cur,prv,sub:periodSub(P)};

  for(let i=0;i<=n;i++){const v=min+i*step;g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" class="'+(Math.abs(v)<1e-6?'c-zero':'c-grid')+'"/><text x="'+(L-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" class="c-ax">'+shortNum(v)+'</text>';}
  let bars='';const pts=[];
  series.forEach((s,i)=>{
    const cx=L+gw*i+gw/2,y0=y(0),yr=y(Math.max(0,s.rev)),ye=y(Math.max(0,s.exp));
    bars+='<rect x="'+(cx-bw-2).toFixed(1)+'" y="'+yr.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,y0-yr).toFixed(1)+'" rx="3" class="c-rev"><title>'+esc(s.full)+': pendapatan '+rp(s.rev)+'</title></rect>';
    bars+='<rect x="'+(cx+2).toFixed(1)+'" y="'+ye.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,y0-ye).toFixed(1)+'" rx="3" class="c-exp"><title>'+esc(s.full)+': biaya '+rp(s.exp)+'</title></rect>';
    bars+='<text x="'+cx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" class="c-ax">'+s.label+'</text>';
    pts.push([cx,y(s.ni),s]);
  });
  const path='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  const dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" class="'+(p[2].ni>=0?'c-ni':'c-loss')+'"><title>'+esc(p[2].full)+': '+(p[2].ni>=0?'laba ':'rugi ')+rp(Math.abs(p[2].ni))+'</title></circle>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Grafik pendapatan, biaya, dan laba enam bulan terakhir">'+g+bars+'<path d="'+path+'" class="c-line"/>'+dots+'</svg>';
}

function md(src){
  const lines=esc(src).split('\n');let html='',list=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const close=()=>{if(list){html+='</'+list+'>';list=null;}};
  for(const raw of lines){
    const l=raw.replace(/\s+$/,'');let m;
    if((m=l.match(/^#{1,6}\s+(.*)/))){close();html+='<h3>'+inl(m[1])+'</h3>';continue;}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){close();html+='<ul>';list='ul';}html+='<li>'+inl(m[1])+'</li>';continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();html+='<ol>';list='ol';}html+='<li>'+inl(m[1])+'</li>';continue;}
    if(!l.trim()){close();continue;}
    close();html+='<p>'+inl(l)+'</p>';
  }
  close();return html;
}

async function runAI(){
  const sample=S.sample;if(!sample||S.ui.aiBusy)return;
  const B=biz(),P=resolvePeriod(S.ui.period);
  const prompt=aiPrompt(B,P);
  S.ui.aiBusy=true;S.ui.aiOut='';S.ui.aiErr='';S.ui.aiMeta={key:aiKey(B,P),label:P.label,focus:AI_FOCUS[S.ui.aiFocus].label};
  const ctl=new AbortController();S.aiCtl=ctl;render();
  try{
    const r=await sample(prompt,{signal:ctl.signal,modelTier:'default',onText:u=>{S.ui.aiOut=u.text;const el=$('#aiout');if(el)el.innerHTML=md(u.text);}});
    S.ui.aiOut=r.text;if(r.truncated)S.ui.aiErr='Jawaban terpotong karena terlalu panjang.';
  }catch(e){
    const c=e&&e.code;S.ui.aiOut=(e&&e.text)||'';
    if(c==='not_granted'&&S.aiMode!=='api')S.aiDenied=true;
    S.ui.aiErr=c==='cancelled'?'':aiErr(c);
    if(!S.ui.aiOut&&c==='cancelled')S.ui.aiMeta=null;
  }finally{S.ui.aiBusy=false;S.aiCtl=null;if(S.ui.view==='analisis')render();}
}

async function sendChat(q){
  q=String(q||'').trim();if(!q||S.ui.chatBusy||!S.sample)return;
  const B=biz(),P=resolvePeriod(S.ui.period);
  const turns=[{role:'user',content:'Anda adalah konsultan keuangan UMKM di Indonesia. Jawab pertanyaan pemilik usaha berdasarkan data keuangan berikut. Gunakan bahasa Indonesia sederhana, praktis, maksimal sekitar 200 kata, boleh memakai Markdown ringan. Jangan mengarang angka di luar data; jika perlu asumsi, sebutkan asumsinya.\n\nDATA KEUANGAN\n'+aiData(B,P)}];
  if(S.ui.aiOut&&S.ui.aiMeta&&S.ui.aiMeta.key.indexOf(B.id)===0)turns.push({role:'assistant',content:S.ui.aiOut});
  S.ui.chat.forEach(m=>{if(m.content&&m.content.trim()&&!m.err)turns.push({role:m.role,content:m.content});});
  while(turns.length>12)turns.splice(1,1);
  turns.push({role:'user',content:q});
  S.ui.chat.push({role:'user',content:q});
  const msg={role:'assistant',content:'',pending:true};S.ui.chat.push(msg);
  S.ui.chatBusy=true;const ctl=new AbortController();S.chatCtl=ctl;renderChat();
  try{
    const r=await S.sample(turns,{cache:false,signal:ctl.signal,modelTier:'default',onText:u=>{msg.content=u.text;renderChat();}});
    msg.content=r.text;
  }catch(e){
    const c=e&&e.code;msg.content=(e&&e.text)||'';msg.err=c==='cancelled'?'Dihentikan.':aiErr(c);
    if(c==='not_granted'){S.aiDenied=true;}
  }finally{msg.pending=false;S.ui.chatBusy=false;S.chatCtl=null;if(S.aiDenied&&S.ui.view==='analisis')render();else renderChat();}
}

function openingModal(bal,B){let s=0;Object.keys(bal||{}).forEach(id=>{const a=B?acc(B,id):null;const v=R0(bal[id]);if(!v)return;const n=a?accNormal(a):(['utang','pinjaman','akum','dp','utanglain'].indexOf(id)>=0?'K':'D');s+=n==='D'?v:-v;});return s;}

let sheetT;
function showSheet(html,wide){
  const w=$('#sheet');clearTimeout(sheetT);

  }

  setTimeout(()=>{const f=$('[autofocus]',s)||$('.kopt',s)||$('button',s);if(f)try{f.focus({preventScroll:true});}catch(e){f.focus();}},80);
}

function viaOptions(B,kind){
  const K=KINDS[kind];const list=B.accounts.filter(isCash).map(a=>({id:a.id,label:a.name}));
  (K.extra||[]).forEach(r=>{const a=roleAcc(B,r);if(a)list.push({id:a,label:VIA_EXTRA[r]});});
  return list;
}
function blankForm(kind){return{kind,date:todayStr(),amount:0,desc:'',cat:'',via:'',hpp:0,bunga:0,from:'',to:'',debit:'',credit:'',items:[],contact:'',cname:'',cphone:'',due:'',no:''};}
function newForm(kind,keep){
  const B=biz(),K=KINDS[kind],f=blankForm(kind);
  if(keep)f.date=keep.date||f.date;
  if(K.via){const v=viaOptions(B,kind);f.via=keep&&keep.via&&v.some(x=>x.id===keep.via)?keep.via:(v[0]?v[0].id:'');}
  if(K.cat){
    const list=B.accounts.filter(K.cat);let def=list[0]?list[0].id:'';
    if(kind==='jual'){const pref=(BIZ_TYPES[B.profile.type]||{}).rev;if(list.some(a=>a.id===pref))def=pref;}
    if(kind==='pinjam'){const l=roleAcc(B,'loan');if(l&&list.some(a=>a.id===l))def=l;}
    f.cat=keep&&keep.cat&&list.some(a=>a.id===keep.cat)?keep.cat:def;
  }
  if(K.fromto){const c=B.accounts.filter(isCash);f.from=c[0]?c[0].id:'';f.to=c[1]?c[1].id:f.from;}
  if(K.manual){f.debit=B.accounts[0].id;f.credit=B.accounts[1].id;}
  if(ITEMK[kind]){const ch=itemChoices(B,kind);if(ch.length)f.items=[itemLine(B,kind,ch[0])];}
  return f;
}
function buildLines(f,B){
  const A=R0(f.amount),r=x=>roleAcc(B,x),K=KINDS[f.kind];
  const D=(a,v,k)=>k?{a,d:v,c:0,k:1}:{a,d:v,c:0},C=(a,v,k)=>k?{a,d:0,c:v,k:1}:{a,d:0,c:v};
  const cp=K.fixed?r(K.fixed):f.cat;
  switch(f.kind){
    case 'jual':{const L=[D(f.via,A),C(cp,A,1)];const h=R0(f.hpp);if(h>0)L.push(D(r('cogs'),h),C(r('inv'),h));return L;}
    case 'terima_piutang':case 'terima_dp':case 'pend_lain':case 'setor_modal':case 'pinjam':return[D(f.via,A),C(cp,A,1)];
    case 'beban':case 'beli_stok':case 'beli_aset':case 'bayar_pajak':case 'beban_lain':case 'prive':return[D(cp,A,1),C(f.via,A)];
    case 'bayar_utang':{const b=R0(f.bunga);const L=[D(cp,A,1)];if(b>0)L.push(D(r('interest'),b,1));L.push(C(f.via,A+b));return L;}
    case 'pindah':return[D(f.to,A),C(f.from,A)];
    case 'susut':return[D(r('dep'),A,1),C(r('accdep'),A)];
    case 'hpp_stok':return[D(r('cogs'),A,1),C(r('inv'),A)];
    case 'jurnal':return[D(f.debit,A,1),C(f.credit,A,1)];
  }
  return[];
}
function validate(f,B){
  const K=KINDS[f.kind];
  if(!f.date)return'Isi tanggal transaksi.';
  prepItems(f,B);
  const ie=validateItems(f,B);if(ie)return ie;
  if(!(f.amount>0))return'Isi jumlah lebih dari 0.';
  if(PARTY[f.kind]&&isCredit(f,B)&&!String(f.cname||'').trim())return f.kind==='jual'?'Isi nama pelanggan agar piutangnya bisa ditagih.':'Isi nama pemasok agar utangnya bisa dilacak.';
  if(K.cat&&!acc(B,f.cat))return'Pilih '+K.catLabel.toLowerCase()+'.';
  if(K.via&&!acc(B,f.via))return'Pilih '+K.viaLabel.toLowerCase()+'.';
  if(K.fixed&&!roleAcc(B,K.fixed))return'Akun pendukung tidak ditemukan. Periksa daftar akun di Pengaturan.';
  if(K.fromto&&(!f.from||!f.to||f.from===f.to))return'Pilih akun asal dan tujuan yang berbeda.';
  if(K.manual&&(!f.debit||!f.credit||f.debit===f.credit))return'Pilih akun debit dan kredit yang berbeda.';
  const L=buildLines(f,B);if(L.some(l=>!l.a||!acc(B,l.a)))return'Ada akun yang belum tersedia. Periksa daftar akun di Pengaturan.';
  return'';
}
function autoDesc(f,B){const K=KINDS[f.kind];if(K.cat&&f.cat&&acc(B,f.cat))return acc(B,f.cat).name;return K.label;}
function previewHtml(){
  const f=S.form,B=biz();const t='<p class="t">Dicatat di pembukuan sebagai</p>';
  if(!f||!(f.amount>0))return t+'<p class="hint">Isi jumlah untuk melihat pengaruhnya ke pembukuan.</p>';
  const err=validate(f,B);if(err)return t+'<p class="hint">'+esc(err)+'</p>';
  return t+'<ul>'+buildLines(f,B).map(l=>{const a=acc(B,l.a);const n=accNormal(a);const amt=l.d||l.c;const up=(l.d&&n==='D')||(l.c&&n==='K');return '<li><span>'+esc(a.name)+' '+(up?'bertambah':'berkurang')+'<em>'+(l.d?'debit':'kredit')+'</em></span><span class="num">'+(up?'+':'−')+nf.format(R0(amt))+'</span></li>';}).join('')+'</ul>';
}

async function saveFile(name,data){
  const dl=S.downloads;
  if(dl){
    try{await dl.save({filename:name,data});return true;}
    catch(e){const c=e&&e.code;if(c==='declined')return false;if(c==='rate_limited'){toast('Tunggu sebentar, lalu coba unduh lagi.');return false;}toast('Unduhan tidak tersedia di tampilan ini.');return false;}
  }
  try{const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;}
  catch(e){toast('Unduhan tidak tersedia di tampilan ini.');return false;}
}
let xlsxP=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(!xlsxP)xlsxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('xlsx'));s.onerror=()=>{xlsxP=null;rej(new Error('xlsx'));};document.head.appendChild(s);});
  return withTimeout(xlsxP,15000);
}
function aoaRows(B,title,sub,rows,cols){
  const out=[[B.profile.name],[title],[sub],[]];if(cols)out.push(cols);
  rows.forEach(r=>{if(r.t==='sec')out.push([r.l]);else{const x=[(r.t==='item'?'    ':'')+r.l,R0(r.v)];if(r.p!==undefined)x.push(R0(r.p));out.push(x);}});
  return out;
}

  for(const e of list){
    if(opt.exclude&&e.id===opt.exclude)continue;
    if(opt.upto&&(e.date>opt.upto.date||(e.date===opt.upto.date&&(e.ts||0)>opt.upto.ts)))continue;
    let tot=0;
    e.form.items.forEach(ln=>{
      const s=st[ln.item];const q=+ln.qty||0;if(!s)return;
      if(e.kind==='beli_stok'){
        const pr=+ln.price||0;s.qty+=q;s.val+=q*pr;s.inQ+=q;if(s.qty>1e-9)s.avg=s.val/s.qty;else if(pr)s.avg=pr;
        if(mv&&ln.item===opt.track)mv.push({e,qin:q,qout:0,bal:s.qty});
      }else{
        const avg=s.qty>1e-9?s.val/s.qty:(s.avg||0);const c=q*avg;
        s.qty-=q;s.val-=c;if(Math.abs(s.qty)<1e-9){s.qty=0;s.val=0;}else if(s.qty<0)s.val=s.qty*avg;
        s.avg=avg;s.outQ+=q;tot+=c;
        if(mv&&ln.item===opt.track)mv.push({e,qin:0,qout:q,bal:s.qty});
      }
    });
    hpp[e.id]={tot:R0(tot)};
  }
  return{st,hpp,mv};
}
function syncStock(B){
  if(!B.items.length)return;
  const r=stockCalc(B);const keys=new Set();
  txOf(B).forEach(e=>{
    const h=r.hpp[e.id];if(!h)return;const f=e.form;
    if(e.kind==='jual'&&R0(f.hpp)!==h.tot){f.hpp=h.tot;e.lines=buildLines(f,B);keys.add('tx:'+B.id+':'+monthKey(e.date));}
    else if(e.kind==='hpp_stok'&&R0(f.amount)!==h.tot){f.amount=h.tot;e.amt=h.tot;e.lines=buildLines(f,B);keys.add('tx:'+B.id+':'+monthKey(e.date));}
  });
  if(keys.size)markDirty.apply(null,Array.from(keys));
}
function prepItems(f,B){
  if(!itemsOn(f))return;
  if(f.kind==='jual'||f.kind==='beli_stok')f.amount=R0(f.items.reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0));
  f._short=[];
  if(f.kind==='jual'||f.kind==='hpp_stok'){
    const st=stockCalc(B,{exclude:f.id,upto:{date:f.date||todayStr(),ts:f.ts||Infinity}}).st;let tot=0;
    f.items.forEach(l=>{
      const s=st[l.item];l._c=0;if(!s)return;const q=+l.qty||0;
      if(q>s.qty+1e-9){const it=itemOf(B,l.item);if(it)f._short.push(it.name+' tersisa '+qtyFmt(Math.max(0,s.qty))+' '+(it.unit||''));}
      const avg=s.qty>1e-9?s.val/s.qty:(s.avg||0);l._c=q*avg;tot+=l._c;s.qty-=q;s.val-=l._c;
    });
    if(f.kind==='jual')f.hpp=R0(tot);else f.amount=R0(tot);
  }
}
function validateItems(f,B){
  if(!itemsOn(f))return'';
  for(const l of f.items){
    const it=itemOf(B,l.item);if(!it)return'Pilih barang di setiap baris.';
    if(!(+l.qty>0))return'Isi jumlah '+it.name+' lebih dari 0.';
    if(f.kind!=='jual'&&it.svc)return it.name+' adalah jasa, jadi tidak punya stok.';
    if(f.kind==='beli_stok'&&!(+l.price>0))return'Isi harga beli '+it.name+'.';
  }
  if(f.kind==='hpp_stok'&&!(f.amount>0))return'Nilai stok barang ini belum diketahui. Isi harga beli pada stok awal barang, atau catat pembeliannya lebih dulu.';
  return'';
}
function itemsDesc(B,f){
  if(!f.items||!f.items.length)return'';
  const n=f.items.map(l=>{const it=itemOf(B,l.item);return it?lc1(it.name):'';}).filter(Boolean);if(!n.length)return'';
  const list=n.length<=2?n.join(' dan '):n.slice(0,2).join(', ')+', dan '+(n.length-2)+' lainnya';
  return({jual:'Penjualan ',beli_stok:'Pembelian ',hpp_stok:'Stok keluar: '}[f.kind]||'')+list;
}
function lastCost(B,id){
  let c=null,d='';
  txOf(B).forEach(e=>{if(e.kind!=='beli_stok'||!e.form||!e.form.items)return;e.form.items.forEach(l=>{if(l.item===id&&e.date>=d&&+l.price>0){d=e.date;c=+l.price;}});});
  if(c!=null)return c;const it=itemOf(B,id);return it&&it.open?(+it.open.cost||0):0;
}
function itemLine(B,kind,it){return{item:it.id,qty:1,price:kind==='beli_stok'?R0(lastCost(B,it.id)):kind==='jual'?R0(it.price):0};}
function isLow(it,s){if(it.svc||!s)return false;const min=+it.min||0;return min>0?s.qty<=min:s.qty<=0;}
function lowStock(B){
  if(!stockItems(B).length)return[];
  const st=stockCalc(B).st;
  return stockItems(B).filter(it=>{const s=st[it.id];if(!s)return false;if(+it.min>0)return s.qty<=+it.min;return s.qty<=0&&(s.inQ>0||s.outQ>0);}).map(it=>({it,qty:st[it.id].qty}));
}
function soldIn(B,P){
  const r={};
  txOf(B).forEach(e=>{if(e.kind!=='jual'||!inP(e,P)||!e.form||!Array.isArray(e.form.items))return;e.form.items.forEach(l=>{const o=r[l.item]||(r[l.item]={q:0,v:0});o.q+=+l.qty||0;o.v+=(+l.qty||0)*(+l.price||0);});});
  return r;
}

/* ---------- Piutang dan utang per kontak ---------- */
function arap(B,side){
  const id=roleAcc(B,side),term=termOf(B),today=todayStr();
  const by={};const get=c=>by[c]||(by[c]={id:c,inv:[],credit:0,paid:0,tx:[]});
  if(id)sortAsc(allEntries(B)).forEach(e=>{
    let n=0;e.lines.forEach(l=>{if(l.a===id)n+=(l.d||0)-(l.c||0);});
    if(side==='ap')n=-n;n=R0(n);if(!n)return;
    const C=get((e.form&&e.form.contact)||'');C.tx.push({e,v:n});
    if(n>0){let left=n;if(C.credit>0){const x=Math.min(C.credit,left);C.credit-=x;left-=x;}C.inv.push({e,amt:n,left,due:(e.form&&e.form.due)||addDays(e.date,term)});}
    else{let p=-n;C.paid+=p;for(const iv of C.inv){if(p<=0)break;if(iv.left<=0)continue;const x=Math.min(iv.left,p);iv.left-=x;p-=x;}C.credit+=p;}
  });
  Object.keys(by).forEach(k=>{
    const C=by[k];C.open=C.inv.filter(iv=>iv.left>0.5);
    C.bal=R0(C.open.reduce((s,iv)=>s+iv.left,0)-C.credit);
    C.overdue=R0(C.open.filter(iv=>iv.due<today).reduce((s,iv)=>s+iv.left,0));
    C.nextDue=C.open.reduce((m,iv)=>!m||iv.due<m?iv.due:m,'');
  });
  const list=Object.keys(by).map(k=>by[k]).filter(C=>R0(C.bal)!==0||C.open.length);
  const age={cur:0,a30:0,a60:0,a90:0};
  list.forEach(C=>C.open.forEach(iv=>{const d=daysBetween(iv.due,today);if(d<=0)age.cur+=iv.left;else if(d<=30)age.a30+=iv.left;else if(d<=60)age.a60+=iv.left;else age.a90+=iv.left;}));
  list.sort((a,b)=>(b.overdue-a.overdue)||(b.bal-a.bal));
  return{list,all:by,age,total:R0(list.reduce((s,C)=>s+C.bal,0)),overdue:R0(list.reduce((s,C)=>s+C.overdue,0))};
}

/* ---------- Transaksi rutin ---------- */
function recurNext(r){return r.last?nextMonth(r.last):r.start;}
function recurName(B,r){return (r.form&&r.form.desc)||autoDesc(r.form||{kind:r.kind},B);}
function recurAmt(r){return R0(r.form.amount)+(r.kind==='bayar_utang'?R0(r.form.bunga):0);}
function recurDue(B){
  const today=todayStr(),cur=monthKey(today),out=[];
  B.recur.forEach(r=>{if(r.on===false||!KINDS[r.kind])return;let m=recurNext(r),n=0;while(m<=cur&&n<12){const d=dayIn(m,r.day);if(d>today)break;out.push({r,m,date:d});m=nextMonth(m);n++;}});
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function recurTemplate(f){return{kind:f.kind,amount:R0(f.amount),desc:(f.desc||'').trim(),cat:f.cat||'',via:f.via||'',bunga:R0(f.bunga),from:f.from||'',to:f.to||'',debit:f.debit||'',credit:f.credit||'',cname:(f.cname||'').trim(),cphone:(f.cphone||'').trim()};}
function formFromRecur(B,r,m){
  const f=Object.assign(blankForm(r.kind),clone(r.form),{date:dayIn(m,r.day),recurId:r.id,recurMonth:m,items:[]});
  const K=KINDS[r.kind];
  if(K.via&&!acc(B,f.via)){const v=viaOptions(B,r.kind);f.via=v[0]?v[0].id:'';}
  if(K.cat&&!acc(B,f.cat)){const l=B.accounts.filter(K.cat);f.cat=l[0]?l[0].id:'';}
  if(PARTY[r.kind]&&isCredit(f,B))f.due=addDays(f.date,termOf(B));
  return f;
}

/* ---------- Anggaran ---------- */
function budgetRows(B,mk){
  const from=mk+'-01',to=monthEnd(mk),p=pl(B,from,to);
  const val=(g,id)=>{const r=p.rows[g].find(x=>x.a.id===id);return r?r.v:0;};
  const rows=[];
  B.accounts.filter(a=>['cogs','opx','oe'].indexOf(a.group)>=0&&!a.contra).forEach(a=>{
    const bud=R0(B.budget[a.id]),act=val(a.group,a.id);
    if(a.group==='oe'&&!bud&&!R0(act))return;
    rows.push({a,bud,act});
  });
  return{rows,p,from,to,rev:p.t.rev,target:R0(B.target.rev)};
}

/* ---------- Pengingat di beranda ---------- */
function alertsOf(B){
  const out=[],today=todayStr();
  const due=recurDue(B);
  if(due.length)out.push({t:'warn',s:due.length===1?'Transaksi rutin “'+recurName(B,due[0].r)+'” jatuh tempo '+fmtShort(due[0].date)+' dan belum dicatat.':due.length+' transaksi rutin sudah jatuh tempo dan belum dicatat.',href:'#rutin',btn:'Catat'});
  const ar=arap(B,'ar');
  if(ar.overdue>0){const n=ar.list.filter(C=>C.overdue>0).length;out.push({t:'bad',s:'Piutang '+rp(ar.overdue)+' dari '+n+' pelanggan sudah lewat jatuh tempo.',href:'#piutang',btn:'Tagih'});}
  else{const soon=addDays(today,7);let v=0;ar.list.forEach(C=>C.open.forEach(iv=>{if(iv.due<=soon)v+=iv.left;}));if(v>0)out.push({t:'neutral',s:'Piutang '+rp(v)+' jatuh tempo dalam 7 hari ke depan.',href:'#piutang',btn:'Lihat'});}
  const ap=arap(B,'ap');const soon=addDays(today,7);let apv=0,apo=0;
  ap.list.forEach(C=>C.open.forEach(iv=>{if(iv.due<=soon)apv+=iv.left;if(iv.due<today)apo+=iv.left;}));
  if(apv>0)out.push({t:apo>0?'bad':'warn',s:apo>0?'Utang ke pemasok '+rp(apo)+' sudah lewat jatuh tempo.':'Utang ke pemasok '+rp(apv)+' jatuh tempo dalam 7 hari ke depan.',href:'#piutang',btn:'Lihat'});
  const low=lowStock(B);
  if(low.length){const nm=low.slice(0,3).map(x=>x.it.name+' ('+qtyFmt(Math.max(0,x.qty))+')');out.push({t:'warn',s:'Stok menipis: '+nm.join(', ')+(low.length>3?', dan '+(low.length-3)+' lainnya':'')+'.',href:'#stok',btn:'Lihat'});}
  const bd=budgetRows(B,monthKey(today));const over=bd.rows.filter(r=>r.bud>0&&r.act>r.bud);
  if(over.length)out.push({t:'warn',s:(over.length===1?over[0].a.name+' sudah melewati anggaran bulan ini sebesar '+rp(over[0].act-over[0].bud)+'.':over.length+' kategori biaya sudah melewati anggaran bulan ini.'),href:'#anggaran',btn:'Lihat'});
  return out;
}

const srcAttr=(s,l)=>' data-act="drill" data-l="'+esc(l)+'" data-src="'+esc(JSON.stringify(s))+'"';
const cashIdsOf=B=>B.accounts.filter(isCash).map(a=>a.id);
function drillMv(B,src){
  const ids=new Set(src.a||[]);const multi=ids.size>1;const rows=[];let tot=0;
  sortAsc(allEntries(B)).forEach(e=>{
    if(e.opening){if(src.xo)return;if(!src.io&&!src.oo&&((src.f&&e.date<src.f)||(src.t&&e.date>src.t)))return;}
    else{if(src.oo)return;if((src.f&&e.date<src.f)||(src.t&&e.date>src.t))return;}
    let v=0;const names=[];
    e.lines.forEach(l=>{if(!ids.has(l.a))return;v+=(l.d||0)-(l.c||0);if(multi){const a=acc(B,l.a);if(a&&names.indexOf(a.name)<0)names.push(a.name);}});
    v=R0(v*(src.sg||1));if(!v)return;tot+=v;rows.push({e,v,run:tot,an:names.join(', ')});
  });
  const n=rows.filter(r=>!r.e.opening).length,op=rows.some(r=>r.e.opening);
  let sum;
  if(!rows.length)sum='Tidak ada transaksi yang membentuk angka ini '+(src.bal?'per '+fmtLong(src.t||lastDate()):spanText(src.f,src.t))+'.';
  else if(src.bal)sum='Saldo '+(src.t?'per '+fmtLong(src.t):'')+' berasal dari '+(op?'saldo awal'+(n?' dan ':''):'')+(n?n+' transaksi':'')+'. Ketuk transaksi untuk melihat atau mengubahnya.';
  else sum='Jumlah dari '+n+' transaksi '+spanText(src.f,src.t)+'. Ketuk transaksi untuk melihat atau mengubahnya.';
  return{mode:'mv',rows,total:R0(tot),bal:!!src.bal,sum};
}
function drillData(B,src){
  const k=src.k;

    if(src.f){rows.push({l:'Laba ditahan',v:b.niPrior,s:{k:'re',t:addDays(src.f,-1)}});rows.push({l:'Laba (rugi) periode berjalan',v:b.niPeriod,s:{k:'ni',lv:'ni',f:src.f,t:src.t}});}
    else rows.push({l:'Saldo laba',v:b.niAll,s:{k:'re',t:src.t}});
    return{mode:'cmp',rows,total:b.equity,sum:'Ekuitas adalah modal pemilik ditambah laba yang belum diambil, per '+fmtLong(src.t)+'.'};
  }
  if(k==='le'){
    const b=bs(B,src.t,src.f);
    return{mode:'cmp',rows:[{l:'Total kewajiban',v:b.totalLiab,s:{k:'grp',g:['kp','kj'],t:src.t}},{l:'Total ekuitas',v:b.equity,s:{k:'eqt',f:src.f,t:src.t}}],total:b.totalLiab+b.equity,sum:'Sisi kanan neraca: dari mana harta usaha dibiayai, yaitu utang dan modal sendiri.'};

  if(k==='plc'){
    const p=pl(B,src.f,src.t);const rows=[];
    src.g.forEach(g=>p.rows[g].forEach(r=>rows.push({l:r.a.name,v:r.v,s:{k:'mv',a:[r.a.id],sg:GROUPS[g].type==='rev'?-1:1,f:src.f,t:src.t}})));
    return{mode:'cmp',rows,total:R0(rows.reduce((s,r)=>s+r.v,0)),sum:'Rincian per kategori '+spanText(src.f,src.t)+'. Ketuk kategori untuk melihat transaksinya.'};

    const rows=[];
    G.forEach(g=>{const list=p.rows[g[0]];if(!list.length)return;rows.push({sec:g[2]});list.forEach(r=>rows.push({l:r.a.name,v:r.v,s:{k:'mv',a:[r.a.id],sg:GROUPS[g[0]].type==='rev'?-1:1,f:src.f,t:src.t}}));});

      m=nextMonth(m);

    return{mode:'cmp',rows,total:tot,sum:'Laba ditahan adalah kumpulan laba bersih sejak mulai mencatat ('+fmtLong(fd)+') sampai '+fmtLong(t)+'. Uang yang diambil untuk keperluan pribadi dicatat di akun prive, terpisah dari angka ini.'};
  }
  if(k==='cf'){
    const it=[];cashflow(B,src.f,src.t,(c,a,e,eff)=>{if(src.c&&c!==src.c)return;if(src.a&&a!==src.a)return;it.push({c,a,e,eff});});
    if(src.a){
      const map=new Map();it.forEach(x=>{const o=map.get(x.e.id)||{e:x.e,v:0};o.v+=x.eff;map.set(x.e.id,o);});
      let run=0;const rows=Array.from(map.values()).map(o=>{const v=R0(o.v);run+=v;return{e:o.e,v,run};}).filter(r=>r.v);

    return{mode:'cmp',rows:['op','inv','fin'].map(c=>({l:L[c],v:by[c],s:{k:'cf',c,f:src.f,t:src.t}})),total:R0(by.op+by.inv+by.fin),sum:'Perubahan saldo kas dan bank '+spanText(src.f,src.t)+'.'};
  }
  if(k==='pm'){

    return{mode:'cmp',rows:r.rows.filter(x=>x.t!=='grand').map(x=>({l:x.l,v:x.v,s:x.s})),total:r.q.end,sum:'Modal akhir sama dengan modal awal ditambah setoran modal dan laba, dikurangi prive.'};
  }
  if(k==='eqs'){

    B.accounts.filter(a=>a.group==='eq').forEach(a=>{const s={k:'mv',a:[a.id],sg:-1,t,bal:1,io:1,oo:f?0:1};const d=drillMv(B,s);if(R0(d.total))rows.push({l:a.name,v:d.total,s});});

function formFromTx(B,e){
  const src=clone(e.form||{});
  const f=Object.assign(blankForm(e.kind),src,{id:e.id,kind:e.kind,date:e.date,ts:e.ts});
  f.desc=src.desc!=null?src.desc:e.desc;
  if(!Array.isArray(f.items))f.items=[];
  const c=contactOf(B,f.contact);f.cname=c?c.name:'';f.cphone=c?c.phone||'':'';
  return f;

function nextNo(B,date,type){
  B.seq=B.seq||{};const k=type==='kw'?'kw':'inv';B.seq[k]=(+B.seq[k]||0)+1;
  return (k==='kw'?'KW/':'INV/')+date.slice(0,4)+date.slice(5,7)+'/'+String(B.seq[k]).padStart(4,'0');
}
function commitTx(B,f){
  prepItems(f,B);
  let bizDirty=false,cid='';
  if(PARTY[f.kind]){const nm=String(f.cname||'').trim();if(nm){cid=ensureContact(B,nm,f.cphone,PARTY[f.kind]);bizDirty=true;}}
  const list=txOf(B),old=f.id?list.find(x=>x.id===f.id):null;
  let no=f.no||(old&&old.form&&old.form.no)||'';
  if(!no&&f.kind==='jual'){no=nextNo(B,f.date,'inv');bizDirty=true;}
  if(!no&&(f.kind==='terima_piutang'||f.kind==='terima_dp')){no=nextNo(B,f.date,'kw');bizDirty=true;}
  const items=itemsOn(f)?f.items.map(l=>({item:l.item,qty:+l.qty||0,price:R0(l.price)})):[];
  const due=PARTY[f.kind]&&isCredit(f,B)?(f.due||addDays(f.date,termOf(B))):'';
  const form={kind:f.kind,date:f.date,amount:R0(f.amount),desc:(f.desc||'').trim(),cat:f.cat||'',via:f.via||'',hpp:R0(f.hpp),bunga:R0(f.bunga),from:f.from||'',to:f.to||'',debit:f.debit||'',credit:f.credit||'',items,contact:cid,due,no};
  const lines=buildLines(form,B);
  const e={id:f.id||('t'+uid()),date:f.date,kind:f.kind,desc:form.desc||itemsDesc(B,form)||autoDesc(form,B),form,lines,amt:form.amount+(f.kind==='bayar_utang'?form.bunga:0),ts:Date.now()};
  const keys=['tx:'+B.id+':'+monthKey(e.date)];
  if(old){const i=list.indexOf(old);if(monthKey(old.date)!==monthKey(e.date))keys.push('tx:'+B.id+':'+monthKey(old.date));e.ts=old.ts||e.ts;list[i]=e;}
  else list.push(e);
  sortTx(list);
  if(bizDirty)keys.push('biz:'+B.id);
  markDirty.apply(null,keys);
  if(items.length||(old&&old.form&&old.form.items&&old.form.items.length))syncStock(B);
  return e;
}
function saveTx(again){
  const B=biz(),f=S.form;if(!f)return;
  const err=validate(f,B);if(err){const el=$('#ferr');if(el)el.textContent=err;return;}
  const isNew=!f.id,kind=f.kind;
  const e=commitTx(B,f);
  if(f.mkRecur&&isNew&&!NO_RECUR[kind]&&!itemsOn(f)){
    B.recur.push({id:'r'+uid(),kind,form:recurTemplate(f),day:+f.date.slice(8,10),start:monthKey(f.date),last:monthKey(f.date),on:true});
    markDirty('biz:'+B.id);
  }
  if(f.recurId){const r=B.recur.find(x=>x.id===f.recurId);if(r&&(!r.last||f.recurMonth>r.last)){r.last=f.recurMonth;markDirty('biz:'+B.id);}}
  toast(isNew?(f.mkRecur?'Transaksi disimpan dan dijadwalkan tiap bulan':'Transaksi disimpan'):'Perubahan disimpan');
  if(kind==='jual'&&isNew&&S.ui.notaAfter&&!again){S.form=null;S.sheetBack=[];S.sheetCur={type:'nota',id:e.id};ensureNo(B,e);showSheet(notaSheetHtml(B,e),true);render();return;}
  if(again&&isNew){openTxForm(newForm(kind,f));}
  else if(S.sheetBack.length){S.form=null;reshow(S.sheetBack.pop());}
  else closeSheet();
  render();
}

function ensureNo(B,e){
  if(!NOTAK[e.kind])return;e.form=e.form||{};
  if(!e.form.no){e.form.no=nextNo(B,e.date,e.kind==='jual'?'inv':'kw');markDirty('biz:'+B.id,'tx:'+B.id+':'+monthKey(e.date));}
}
function notaInfo(B,e){
  const f=e.form||{},c=contactOf(B,f.contact),arId=roleAcc(B,'ar');
  const credit=e.kind==='jual'&&f.via===arId;let left=0,due=f.due||'';
  if(credit){const C=arap(B,'ar').all[f.contact||''];if(C){const iv=C.inv.find(x=>x.e.id===e.id);if(iv){left=R0(iv.left);due=iv.due;}}}
  let lines;
  if(f.items&&f.items.length)lines=f.items.map(l=>{const it=itemOf(B,l.item);return{n:it?it.name:'Barang',u:it?it.unit||'':'',q:+l.qty||0,p:R0(l.price),s:R0((+l.qty||0)*(+l.price||0))};});
  else lines=[{n:e.desc,single:true,s:R0(f.amount)}];
  let title,status,tone;
  if(e.kind==='jual'){title=credit&&left>0.5?'Faktur tagihan':'Nota penjualan';if(credit){status=left>0.5?'Belum lunas. Sisa tagihan '+rp(left)+', jatuh tempo '+fmtLong(due)+'.':'Lunas.';tone=left>0.5?'due':'ok';}else if(f.via===roleAcc(B,'unearned')){status='Dibayar dari uang muka yang sudah diterima.';tone='ok';}else{status='Lunas, dibayar lewat '+lc1((acc(B,f.via)||{}).name||'kas')+'.';tone='ok';}}
  else{title='Kwitansi';const via=lc1((acc(B,f.via)||{}).name||'kas');
    if(e.kind==='terima_piutang'){const C=arap(B,'ar').all[f.contact||''];const rest=C?Math.max(0,C.bal):0;status='Pembayaran tagihan diterima lewat '+via+'.'+(f.contact?' Sisa tagihan saat ini '+rp(rest)+'.':'');tone=rest>0.5?'due':'ok';}
    else{status='Uang muka diterima lewat '+via+'.';tone='ok';}}
  return{f,c,lines,title,status,tone,total:R0(e.kind==='jual'?f.amount:txAmt(e))};
}
function notaBody(B,e){
  const p=B.profile,n=notaInfo(B,e);
  const meta=[p.address,p.city&&(!p.address||p.address.indexOf(p.city)<0)?p.city:'',p.phone?'Telp/WA '+p.phone:''].filter(Boolean).join('\n');
  const tbl=n.lines[0].single?'<table><thead><tr><th>Keterangan</th><th>Jumlah</th></tr></thead><tbody><tr><td>'+esc(n.lines[0].n)+'</td><td>'+rp(n.lines[0].s)+'</td></tr></tbody><tfoot><tr><td>Total</td><td>'+rp(n.total)+'</td></tr></tfoot></table>':
    '<table><thead><tr><th>Barang</th><th>Jumlah</th><th>Harga</th><th>Subtotal</th></tr></thead><tbody>'+n.lines.map(l=>'<tr><td>'+esc(l.n)+'</td><td>'+qtyFmt(l.q)+(l.u?' '+esc(l.u):'')+'</td><td>'+rp(l.p)+'</td><td>'+rp(l.s)+'</td></tr>').join('')+'</tbody><tfoot><tr><td colspan="3">Total</td><td>'+rp(n.total)+'</td></tr></tfoot></table>';
  return '<div class="nota"><div class="n-top"><div><div class="n-biz">'+esc(p.name)+'</div>'+(meta?'<div class="n-meta">'+esc(meta)+'</div>':'')+'</div><div class="n-doc"><b>'+esc(n.title)+'</b><span>No. '+esc(n.f.no||'-')+'</span><span>'+fmtLong(e.date)+'</span></div></div>'+
  '<div class="n-to"><span>'+(e.kind==='jual'?'Kepada':'Diterima dari')+'</span><b>'+esc(n.c?n.c.name:'Pelanggan')+'</b>'+(n.c&&n.c.phone?'<small>'+esc(n.c.phone)+'</small>':'')+'</div>'+tbl+
  '<div class="n-st '+n.tone+'">'+esc(n.status)+'</div>'+
  (p.bankInfo&&n.tone==='due'?'<div class="n-pay">Pembayaran: '+esc(p.bankInfo)+'</div>':'')+
  (p.notaNote?'<p class="n-note">'+esc(p.notaNote)+'</p>':'')+
  '<div class="n-sign"><div>Hormat kami,<div class="gap"></div>'+esc(p.owner||p.name)+'</div></div></div>';
}
function notaText(B,e){
  const p=B.profile,n=notaInfo(B,e),L=[];
  L.push('*'+p.name+'*',n.title+' No. '+(n.f.no||'-'),'Tanggal: '+fmtLong(e.date));
  if(n.c)L.push((e.kind==='jual'?'Kepada: ':'Dari: ')+n.c.name);
  L.push('');
  n.lines.forEach(l=>L.push(l.single?'- '+l.n+': '+rp(l.s):'- '+l.n+' '+qtyFmt(l.q)+(l.u?' '+l.u:'')+' x '+rp(l.p)+' = '+rp(l.s)));
  L.push('*Total: '+rp(n.total)+'*',n.status);
  if(p.bankInfo&&(n.tone==='due'))L.push('','Pembayaran: '+p.bankInfo);
  if(p.notaNote)L.push('',p.notaNote);
  L.push('','Terima kasih.');
  return L.join('\n');
}
function notaDoc(B,e){

}

/* ---------- Barang & jasa ---------- */
function mgStock(B){
  const P=resolvePeriod(S.ui.period);
  const top='<div class="mghead"><p class="sub">Stok barang bertambah saat dibeli dan berkurang saat dijual lewat formulir transaksi. Modal barang (HPP) dihitung otomatis dari harga beli rata-rata.</p><div class="row">'+periodCtl()+'<button class="btn sm" data-act="itemNew">'+IC.plus+'Tambah barang</button></div></div>';
  if(!B.items.length)return top+'<div class="panel empty"><p>Belum ada barang atau jasa. Daftarkan yang Anda jual beserta harga dan stoknya, lalu saat mencatat penjualan cukup pilih barang dan jumlahnya.</p><button class="btn" data-act="itemNew">'+IC.plus+'Tambah barang</button></div>';
  const st=stockCalc(B).st,sold=soldIn(B,P),stk=stockItems(B);
  let val=0,low=0;stk.forEach(it=>{const s=st[it.id];if(s)val+=s.val;if(isLow(it,s))low++;});
  const invAcc=roleAcc(B,'inv'),invBal=bs(B,lastDate()).inv,diff=R0(val-invBal);
  let strip='',rec='';
  if(stk.length){
    strip='<div class="strip mgstrip">'+
    '<div><div class="k">Barang dengan stok</div><div class="v num">'+stk.length+'</div><div class="s">di luar jasa</div></div>'+
    '<div><div class="k">Nilai stok per barang</div><div class="v num">'+rp(val)+'</div><div class="s">harga beli rata-rata</div></div>'+
    '<div><div class="k">Stok menipis</div><div class="v num'+(low?' out':'')+'">'+low+' barang</div><div class="s">'+(low?'perlu dipesan ulang':'semua aman')+'</div></div>'+
    '<button type="button"'+srcAttr({k:'mv',a:[invAcc],sg:1,t:lastDate(),bal:1},'Persediaan di neraca')+'><div class="k">Persediaan di neraca</div><div class="v num">'+rp(invBal)+'</div><div class="s">dari pembukuan</div></button></div>';
    const tol=0.5*txOf(B).filter(e=>ITEMK[e.kind]&&e.form&&e.form.items&&e.form.items.length).length+1;
    if(Math.abs(diff)>tol){
      const canAdj=R0((B.opening.bal||{})[invAcc])+diff>=0;
      rec='<div class="tipbox mgnote"><p>Nilai stok per barang '+(diff>0?'lebih besar ':'lebih kecil ')+rp(Math.abs(diff))+' dari persediaan di neraca. Biasanya karena stok awal barang belum masuk saldo awal, atau ada pembelian dan pemakaian stok yang dicatat tanpa memilih barang.</p>'+(canAdj?'<button class="btn ghost sm" data-act="stockAdj">Samakan lewat saldo awal</button>':'')+'</div>';
    }
  }
  const rows=B.items.slice().sort((a,b)=>a.name.localeCompare(b.name,'id')).map(it=>itemRow(B,it,st[it.id],sold[it.id],P)).join('');
  return top+strip+rec+'<div class="txsheet">'+rows+'</div>';
}
function itemRow(B,it,s,so,P){
  const q=s?s.qty:0,low=isLow(it,s),sub=[];
  if(it.svc)sub.push('Jasa');
  sub.push('harga jual '+rp(it.price));
  if(!it.svc&&s){const avg=s.qty>1e-9?s.val/s.qty:s.avg;if(avg>0&&it.price>0)sub.push('margin '+pct((it.price-avg)/it.price,0));}
  if(so&&so.q)sub.push('terjual '+qtyFmt(so.q)+(it.unit?' '+it.unit:'')+' '+P.phrase);
  const right=it.svc?'<b>'+rp(it.price)+'</b><span>per '+esc(it.unit||'kali')+'</span>':'<b class="'+(low?(q<=0?'out':'warnc'):'')+'">'+qtyFmt(q)+(it.unit?' '+esc(it.unit):'')+'</b><span>'+rp(s?s.val:0)+'</span>';
  const pill=low?' <span class="pill xs '+(q<=0?'bad':'warn')+'">'+(q<=0?'Habis':'Menipis')+'</span>':'';
  return '<button class="txrow" data-act="itemOpen" data-id="'+esc(it.id)+'"><span class="kico '+(low?(q<=0?'out':'warn'):'neutral')+'">'+IC.box+'</span><span class="d"><b>'+esc(it.name)+pill+'</b><span>'+esc(sub.join(', '))+'</span></span><span class="q num">'+right+'</span></button>';
}
function itemForm(it){return it?{id:it.id,name:it.name,unit:it.unit||'pcs',svc:!!it.svc,price:R0(it.price),min:+it.min||0,oqty:+((it.open||{}).qty)||0,ocost:R0((it.open||{}).cost)}:{id:'',name:'',unit:'pcs',svc:false,price:0,min:0,oqty:0,ocost:0};}

  if(!F.svc)h+='<div class="grid2"><div class="field"><label for="i-oqty">Stok awal</label><input id="i-oqty" class="input num" inputmode="decimal" autocomplete="off" data-in="qty" data-if="oqty" value="'+(F.oqty?esc(qtyFmt(F.oqty)):'')+'" placeholder="0"><span class="hint">Jumlah yang sudah ada saat barang didaftarkan.</span></div>'+

  '<div class="field"><label for="i-min">Batas stok menipis</label><input id="i-min" class="input num" inputmode="decimal" autocomplete="off" data-in="qty" data-if="min" value="'+(F.min?esc(qtyFmt(F.min)):'')+'" placeholder="0"><span class="hint">Diberi tanda bila stok sama atau di bawah angka ini.</span></div></div>';

    const mv=r.mv.slice(-120);
    h+='<section class="card"><h3>Kartu stok</h3><p class="sub">Sisa '+qtyFmt(s.qty)+(it.unit?' '+esc(it.unit):'')+', nilai '+rp(s.val)+', harga beli rata-rata '+rp(avg)+'.</p><div class="dlist">'+
    (mv.length?mv.map(m=>m.open?'<div class="drow"><span class="l"><b>Stok awal</b><span>saat barang didaftarkan</span></span><span class="r"><b class="in">+'+qtyFmt(m.qin)+'</b><span>sisa '+qtyFmt(m.bal)+'</span></span><span></span></div>':
      '<button class="drow" data-act="editTx" data-sub="1" data-id="'+esc(m.e.id)+'"><span class="l"><b>'+esc(m.e.desc)+'</b><span>'+fmtShort(m.e.date)+', '+esc((KINDS[m.e.kind]||{}).label||'')+(m.e.form&&m.e.form.contact?', '+esc(contactName(B,m.e.form.contact)):'')+'</span></span><span class="r"><b class="'+(m.qin?'in':'out')+'">'+(m.qin?'+'+qtyFmt(m.qin):'−'+qtyFmt(m.qout))+'</b><span>sisa '+qtyFmt(m.bal)+'</span></span>'+IC.chev+'</button>').join(''):'<p class="sub">Belum ada keluar-masuk barang ini.</p>')+'</div></section>';

  return h;

  const ar=arap(B,'ar'),ap=arap(B,'ap');

  '<div class="split">'+arapPanel(B,ar,'ar')+arapPanel(B,ap,'ap')+'</div>'+contactsPanel(B,ar,ap);

function arapPanel(B,R,kind){
  const isAr=kind==='ar',ag=R.age;
  const aging='<div class="aging">'+[['Belum jatuh tempo',ag.cur,0],['Lewat 1–30 hari',ag.a30,1],['Lewat 31–60 hari',ag.a60,1],['Lewat 60+ hari',ag.a90,1]].map(x=>'<div><div class="k">'+x[0]+'</div><div class="v num'+(x[2]&&x[1]>0.5?' out':'')+'">'+rp(x[1])+'</div></div>').join('')+'</div>';
  return '<section class="panel"><div class="sechead"><h2>'+(isAr?'Piutang pelanggan':'Utang ke pemasok')+'</h2><span class="bigv num">'+rp(R.total)+'</span></div>'+
  (R.list.length?aging+'<div class="plist">'+R.list.map(C=>arapRow(B,C,kind)).join('')+'</div>':'<p class="sub">'+(isAr?'Tidak ada piutang. Penjualan yang belum dibayar pelanggan akan muncul di sini.':'Tidak ada utang ke pemasok. Pembelian yang belum dibayar akan muncul di sini.')+'</p>')+'</section>';
}
function arapRow(B,C,kind){
  const today=todayStr();let sub=C.open.length?C.open.length+' tagihan':'';
  if(C.overdue>0){const old=C.open.filter(iv=>iv.due<today).reduce((m,iv)=>iv.due<m?iv.due:m,today);sub+=', lewat jatuh tempo '+daysBetween(old,today)+' hari';}
  else if(C.nextDue)sub+=', jatuh tempo '+fmtShort(C.nextDue);
  if(C.bal<0)sub='Pembayaran melebihi tagihan, kemungkinan belum dipilih nama kontaknya';
  const name=C.id?contactName(B,C.id):(kind==='ar'?'Tanpa nama pelanggan':'Tanpa nama pemasok');
  return '<button class="txrow" data-act="cOpen" data-id="'+esc(C.id)+'"><span class="cav'+(C.id?'':' none')+'">'+esc(C.id?initials(name):'?')+'</span><span class="d"><b>'+esc(name)+'</b><span>'+esc(sub)+'</span></span><span class="amt'+(C.overdue>0?' out':'')+'">'+rp(C.bal)+'</span></button>';
}

  return '<section class="panel" style="margin-top:16px"><div class="sechead"><h2>Daftar kontak</h2><span class="hint">'+list.length+' kontak</span></div>'+
  (list.length?'<div class="plist">'+list.map(c=>{const a=ar.all[c.id],p=ap.all[c.id];const bits=[TYPE_LBL[c.type]||'Kontak'];if(c.phone)bits.push(c.phone);

    return '<button class="txrow" data-act="cOpen" data-id="'+esc(c.id)+'"><span class="cav">'+esc(initials(c.name))+'</span><span class="d"><b>'+esc(c.name)+'</b><span>'+esc(bits.join(', '))+'</span></span>'+amt+'</button>';}).join('')+'</div>':
  '<p class="sub">Kontak tersimpan otomatis saat Anda mengisi nama pelanggan atau pemasok di formulir transaksi.</p>')+'</section>';
}
function arReminder(B,c,C){
  const p=B.profile,L=['Halo '+(c?c.name:'')+', kami dari '+p.name+'.','Berikut tagihan yang belum dibayar:'];

  const start=ymd(new Date(y,m-5,1));

  B.demo=true;B.items=items;
  B.budget={sewa:3500000,gaji:4000000,listrik:650000,internet:350000,promosi:500000,perlengkapan:250000};
  B.target={rev:32000000};
  const rnd=rng(31415),T=[],r5=v=>Math.round(v/500)*500;let seq=0;

  const C1='Bu Rina (reseller)',C2='Salon Cantika',C3='Toko Berkah Kosmetik',SUP='CV Sumber Cantik';
  const PH={};PH[C1]='0813-1111-2222';PH[C2]='0857-3333-4444';PH[C3]='0821-5555-6666';PH[SUP]='0811-7777-8888';

    if(date>today)return null;
    const f=Object.assign(blankForm(k),o,{kind:k,date});
    const cid=f.cname?ensureContact(B,f.cname,PH[f.cname]||'',PARTY[k]):'';
    if(f.items&&f.items.length&&(k==='jual'||k==='beli_stok'))f.amount=R0(f.items.reduce((s,l)=>s+l.qty*l.price,0));

    const form={kind:k,date,amount:R0(f.amount),desc:f.desc||'',cat:f.cat||'',via:f.via||'',hpp:0,bunga:R0(f.bunga),from:f.from||'',to:f.to||'',debit:'',credit:'',items:f.items||[],contact:cid,due,no:''};
    const e={id:'t'+uid()+(seq++),date,kind:k,desc:form.desc||itemsDesc(B,form)||autoDesc(form,B),form,lines:buildLines(form,B),amt:form.amount+(k==='bayar_utang'?form.bunga:0),ts:Date.now()+seq};
    T.push(e);return e;
  };
  const sell=(date,via,cname,mult,disc,term)=>{
    const lines=[];
    items.forEach((it,j)=>{let q=Math.round((1+rnd()*3.2)*mult*(j===0?1.4:j===4?0.7:1));q=Math.min(q,qty[it.id]);if(q>0)lines.push({item:it.id,qty:q,price:disc?r5(it.price*(1-disc)):it.price});});
    if(!lines.length)return null;

    if(e)lines.forEach(l=>qty[l.item]-=l.qty);return e;
  };

  for(let i=0;i<6;i++){

    add(D(9),'beban',{amount:r5(160000+rnd()*90000),cat:'perlengkapan',via:'kas',desc:'Kantong belanja dan label harga'});
    const rina=sell(D(10),'piutang',C1,3*g,0.15,14);
    if(rina)add(D(24),'terima_piutang',{amount:rina.amt,via:'bank',cname:C1,desc:'Pelunasan tagihan reseller'});
    add(D(12),'beban',{amount:r5(420000+rnd()*260000),cat:'promosi',via:'bank',desc:'Iklan Instagram dan TikTok'});
    e=sell(D(14),'bank','',7.5*g,0);

    if(i===2)add(D(16),'hpp_stok',{items:[{item:items[3].id,qty:3,price:0}],desc:'Maskara rusak saat pengiriman'});
    if(kasIn>0)add(D(16),'pindah',{amount:r5(kasIn*0.85),from:'kas',to:'bank',desc:'Setor tunai ke rekening'});kasIn=0;

    e=sell(D(21),'kas','',7.5*g,0);if(e)kasIn+=e.amt;
    add(D(25),'beban',{amount:r5(540000+rnd()*160000),cat:'listrik',via:'bank',desc:'Listrik dan air'});
    e=sell(D(28),'bank','',7.5*g,0);
    add(D(28),'beban',{amount:4000000,cat:'gaji',via:'bank',desc:'Gaji 2 karyawan'});
    add(D(28),'prive',{amount:2000000,via:'bank',desc:'Ambil untuk kebutuhan rumah'});
